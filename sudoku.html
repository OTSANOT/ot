<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Sudoku</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #111; --bdr: #cbd5e1; --gbdr: #111;
    --fix: #e2e8f0; --usr: #2563eb; --sel: #bfdbfe; --hi: #eff6ff;
    --bad-bg: #fecaca; --bad-tx: #dc2626; --btn: #fff; --note: #64748b;
  }
  body.dark {
    --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --bdr: #475569; --gbdr: #94a3b8;
    --fix: #0f172a; --usr: #60a5fa; --sel: #1d4ed8; --hi: #1e3a8a33;
    --bad-bg: #7f1d1d; --bad-tx: #fca5a5; --btn: #334155; --note: #94a3b8;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 16px; margin: 0; }
  .box { background: var(--card); padding: 18px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.08); width: 100%; max-width: 400px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 10px; }
  h3 { margin: 0; font-size: 1.2rem; }
  select, button { padding: 8px 10px; border: 1px solid var(--bdr); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--btn); color: var(--text); }
  .blue { background: #2563eb; color: #fff; border: none; margin-left: auto; }
  .info { font-size: 13px; font-weight: 600; color: var(--note); }
  .grid { display: grid; border: 3px solid var(--gbdr); margin-bottom: 14px; user-select: none; border-radius: 4px; overflow: hidden; }
  .cell { aspect-ratio: 1; border: 1px solid var(--bdr); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; cursor: pointer; }
  .s9 .cell { font-size: 16px; }
  .fixed { background: var(--fix); }
  .user { color: var(--usr); }
  .hi { background: var(--hi); }
  .sel { background: var(--sel) !important; color: #fff !important; }
  .wrong { background: var(--bad-bg) !important; color: var(--bad-tx) !important; }
  .s4 .cell:nth-child(2n) { border-right: 3px solid var(--gbdr); }
  .s4 .cell:nth-child(4n) { border-right: none; }
  .s4 .cell:nth-child(n+5):nth-child(-n+8) { border-bottom: 3px solid var(--gbdr); }
  .s6 .cell:nth-child(3n) { border-right: 3px solid var(--gbdr); }
  .s6 .cell:nth-child(6n) { border-right: none; }
  .s6 .cell:nth-child(n+7):nth-child(-n+12), .s6 .cell:nth-child(n+19):nth-child(-n+24) { border-bottom: 3px solid var(--gbdr); }
  .s9 .cell:nth-child(3n) { border-right: 3px solid var(--gbdr); }
  .s9 .cell:nth-child(9n) { border-right: none; }
  .s9 .cell:nth-child(n+19):nth-child(-n+27), .s9 .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid var(--gbdr); }
  .notes { display: grid; width: 100%; height: 100%; font-size: 9px; place-items: center; color: var(--note); line-height: 1; }
  .pad { display: grid; gap: 5px; margin-bottom: 8px; }
  .pad button { padding: 10px 0; font-size: 16px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .note-on { background: #dbeafe !important; border-color: #2563eb !important; color: #1d4ed8 !important; }
  #msg { text-align: center; font-weight: 700; color: #16a34a; margin-top: 10px; min-height: 20px; }
</style>
</head>
<body>
<div class="box">
  <div class="row">
    <h3>Focus Sudoku</h3>
    <button type="button" id="thm">Theme</button>
  </div>
  <div class="row">
    <select id="sz"><option value="4">4x4</option><option value="6" selected>6x6</option><option value="9">9x9</option></select>
    <select id="df"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
    <button type="button" class="blue" id="newBtn">New Game</button>
  </div>
  <div class="row info">
    <span id="tm">00:00</span>
    <span id="bst">Best: --:--</span>
    <span id="ms">Mistakes: 0</span>
  </div>
  <div id="bd" class="grid"></div>
  <div id="pd" class="pad"></div>
  <div class="tools">
    <button type="button" id="nb">Notes: OFF</button>
    <button type="button" id="hb">Hint (3)</button>
    <button type="button" id="eb">Erase</button>
  </div>
  <div id="msg"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const at = (a, i) => a.at(i);
const putAt = (a, i, v) => a.splice(i, 1, v);
let N = 6, sol = new Array(), cur = new Array(), fix = new Array(), nts = new Array();
let sel = null, noteOn = false, err = 0, hints = 3, sec = 0, tmr = null, done = false;

const boxR = n => n === 9 ? 3 : 2;
const boxC = n => n === 4 ? 2 : 3;
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = at(arr, i);
    putAt(arr, i, at(arr, j));
    putAt(arr, j, t);
  }
  return arr;
}

function safe(g, n, r, c, v) {
  const br = boxR(n), bc = boxC(n);
  for (let i = 0; i < n; i++) {
    if (at(g, r * n + i) === v || at(g, i * n + c) === v) return false;
  }
  const sr = Math.floor(r / br) * br, sc = Math.floor(c / bc) * bc;
  for (let r0 = 0; r0 < br; r0++) {
    for (let c0 = 0; c0 < bc; c0++) {
      if (at(g, (sr + r0) * n + sc + c0) === v) return false;
    }
  }
  return true;
}

function countSol(g, n) {
  let cnt = 0;
  function bt() {
    if (cnt > 1) return;
    let bestIdx = -1, bestCands = null;
    for (let i = 0; i < n * n; i++) {
      if (at(g, i) === 0) {
        const r = Math.floor(i / n), c = i % n, cs = new Array();
        for (let v = 1; v <= n; v++) if (safe(g, n, r, c, v)) cs.push(v);
        if (!cs.length) return;
        if (!bestCands || cs.length < bestCands.length) {
          bestIdx = i; bestCands = cs;
          if (cs.length === 1) break;
        }
      }
    }
    if (bestIdx === -1) { cnt++; return; }
    for (const v of bestCands) {
      putAt(g, bestIdx, v);
      bt();
      putAt(g, bestIdx, 0);
    }
  }
  bt();
  return cnt;
}

function makePuzzle(n, d) {
  const g = new Array(n * n).fill(0);
  const nums = Array.from({ length: n }, (_, i) => i + 1);
  function fill(i) {
    if (i === n * n) return true;
    const r = Math.floor(i / n), c = i % n;
    for (const v of shuffle(nums)) {
      if (safe(g, n, r, c, v)) {
        putAt(g, i, v);
        if (fill(i + 1)) return true;
        putAt(g, i, 0);
      }
    }
    return false;
  }
  fill(0);
  const solved = g.slice(), puz = g.slice();
  const blanks = n === 4 ? (d === 'easy' ? 6 : d === 'medium' ? 8 : 10)
               : n === 6 ? (d === 'easy' ? 14 : d === 'medium' ? 19 : 23)
               : (d === 'easy' ? 32 : d === 'medium' ? 40 : 48);
  let rem = 0;
  for (const idx of shuffle(Array.from({ length: n * n }, (_, i) => i))) {
    if (rem >= blanks) break;
    const bak = at(puz, idx);
    putAt(puz, idx, 0);
    if (countSol(puz.slice(), n) === 1) rem++;
    else putAt(puz, idx, bak);
  }
  return { solved, puz };
}

function updateBest(save) {
  let b = {};
  try { b = JSON.parse(localStorage.getItem('fs_best') || '{}'); } catch (e) {}
  const k = N + '_' + $('df').value;
  const prev = Reflect.get(b, k);
  if (save && (prev === undefined || sec < prev)) {
    Reflect.set(b, k, sec);
    try { localStorage.setItem('fs_best', JSON.stringify(b)); } catch (e) {}
  }
  const curBest = Reflect.get(b, k);
  $('bst').textContent = curBest !== undefined ? 'Best: ' + fmt(curBest) : 'Best: --:--';
}

function start() {
  N = Number($('sz').value);
  done = false; err = 0; hints = 3; sel = null;
  $('msg').textContent = '';
  $('ms').textContent = 'Mistakes: 0';
  $('hb').textContent = 'Hint (3)';
  const res = makePuzzle(N, $('df').value);
  sol = res.solved;
  cur = res.puz;
  fix = cur.map(v => v !== 0);
  nts = Array.from({ length: N * N }, () => new Set());
  updateBest(false);
  drawPad();
  drawBoard();
  clearInterval(tmr);
  sec = 0;
  $('tm').textContent = '00:00';
  tmr = setInterval(() => { if (!done) $('tm').textContent = fmt(++sec); }, 1000);
}

function drawPad() {
  const pd = $('pd');
  pd.innerHTML = '';
  pd.style.gridTemplateColumns = 'repeat(' + N + ',1fr)';
  for (let v = 1; v <= N; v++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = v;
    b.onclick = () => put(v);
    pd.appendChild(b);
  }
}

function drawBoard() {
  const bd = $('bd'), bc = boxC(N);
  bd.innerHTML = '';
  bd.className = 'grid s' + N;
  bd.style.gridTemplateColumns = 'repeat(' + N + ',1fr)';
  const sr = sel !== null ? Math.floor(sel / N) : -1;
  const sc = sel !== null ? sel % N : -1;
  const sv = sel !== null ? at(cur, sel) : 0;

  for (let i = 0; i < N * N; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    const r = Math.floor(i / N), col = i % N, val = at(cur, i);
    if (at(fix, i)) c.classList.add('fixed');
    else if (val) c.classList.add('user');
    if (i === sel) c.classList.add('sel');
    else if ((sv && val === sv) || r === sr || col === sc) c.classList.add('hi');
    if (val && val !== at(sol, i)) c.classList.add('wrong');

    if (val) {
      c.textContent = val;
    } else if (at(nts, i).size) {
      const ng = document.createElement('div');
      ng.className = 'notes';
      ng.style.gridTemplateColumns = 'repeat(' + bc + ',1fr)';
      for (let k = 1; k <= N; k++) {
        const s = document.createElement('span');
        s.textContent = at(nts, i).has(k) ? k : '';
        ng.appendChild(s);
      }
      c.appendChild(ng);
    }
    c.onclick = () => { sel = i; drawBoard(); };
    bd.appendChild(c);
  }
}

function put(v) {
  if (done || sel === null || at(fix, sel)) return;
  if (noteOn) {
    if (!at(cur, sel)) {
      const s = at(nts, sel);
      s.has(v) ? s.delete(v) : s.add(v);
    }
  } else {
    putAt(cur, sel, v);
    at(nts, sel).clear();
    if (v !== at(sol, sel)) {
      $('ms').textContent = 'Mistakes: ' + (++err);
    } else {
