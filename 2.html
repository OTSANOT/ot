<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>OT 職業治療：伸手定位＋手指對掌雙重訓練 (計時版)</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      text-align: center;
      background: #121826;
      color: white;
      margin: 0;
      padding: 15px;
    }
    .header { margin-bottom: 8px; }
    .legend {
      display: flex; justify-content: center; gap: 15px;
      margin: 8px 0; font-size: 16px; font-weight: bold;
    }
    .badge { padding: 5px 12px; border-radius: 20px; color: #000; }
    .controls-bar {
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 10px;
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 10px 0;
      border: 1px solid #334155;
      align-items: center;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }
    select {
      padding: 5px 10px;
      font-size: 15px;
      border-radius: 6px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #475569;
      font-weight: bold;
    }
    .game-box {
      position: relative; display: inline-block;
      border: 4px solid #334155; border-radius: 12px; overflow: hidden;
    }
    video, canvas { transform: scaleX(-1); display: block; }
    canvas { position: absolute; left: 0; top: 0; }
    .hud {
      font-size: 22px; margin: 10px;
      display: flex; justify-content: center; gap: 35px;
    }
    .score { color: #38bdf8; font-weight: bold; font-size: 30px; }
    .timer { color: #f87171; font-weight: bold; font-size: 30px; font-variant-numeric: tabular-nums; }
    button {
      padding: 12px 28px; font-size: 18px; font-weight: bold;
      background: #10b981; color: white; border: none;
      border-radius: 8px; cursor: pointer;
    }
    button:disabled { background: #64748b; cursor: not-allowed; }
    #restartBtn { background: #3b82f6; display: none; margin-left: 10px; }
    .summary-banner {
      display: none;
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 15px 25px;
      margin: 10px auto;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>🎯 OT 雙重任務訓練：伸手對準 ＋ 手指捏合 (高靈敏度＋計時版)</h2>
    <p>步驟 1：手掌或手指移入泡泡範圍 ➔ 步驟 2：用拇指輕觸對應顏色【手指】即可得分！</p>
    <div class="legend">
      <span class="badge" style="background:#FF4D4D;">食指（紅）</span>
      <span class="badge" style="background:#4DFF88;">中指（綠）</span>
      <span class="badge" style="background:#4DA6FF;">無名指（藍）</span>
      <span class="badge" style="background:#FFD633;">尾指（黃）</span>
    </div>
  </div>

  <!-- 治療師設定列 -->
  <div class="controls-bar">
    <div class="control-group">
      <label for="durationSelect">⏱️ 訓練時間：</label>
      <select id="durationSelect">
        <option value="1">1 分鐘</option>
        <option value="2">2 分鐘</option>
        <option value="3" selected>3 分鐘</option>
        <option value="4">4 分鐘</option>
        <option value="5">5 分鐘</option>
        <option value="6">6 分鐘</option>
        <option value="7">7 分鐘</option>
        <option value="8">8 分鐘</option>
        <option value="9">9 分鐘</option>
        <option value="10">10 分鐘</option>
      </select>
    </div>
    <div class="control-group">
      <label for="pinchSlider">捏合靈敏度：</label>
      <input type="range" id="pinchSlider" min="0.06" max="0.18" step="0.01" value="0.11">
      <span id="pinchVal">高 (0.11)</span>
    </div>
    <div class="control-group">
      <label for="radiusSlider">目標泡泡大小：</label>
      <input type="range" id="radiusSlider" min="45" max="100" step="5" value="75">
      <span id="radiusVal">75px</span>
    </div>
  </div>
  <br>

  <button id="startBtn" disabled>正在載入手部追蹤模型...</button>
  <button id="restartBtn">🔄 重新開始訓練</button>

  <div id="summaryBanner" class="summary-banner">
    <h3 style="margin: 0 0 8px 0; color: #38bdf8;">🎉 訓練時間結束！</h3>
    <p id="summaryText" style="font-size: 18px; margin: 0;"></p>
  </div>

  <div class="hud">
    <div>剩餘時間：<span id="timerEl" class="timer">03:00</span></div>
    <div>完成目標：<span id="scoreEl" class="score">0</span></div>
    <div>當前任務：<span id="targetText" style="color:#FFD633;">準備開始</span></div>
  </div>

  <div class="game-box">
    <video id="webcam" autoplay playsinline width="640" height="480"></video>
    <canvas id="gameCanvas" width="640" height="480"></canvas>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const scoreEl = document.getElementById("scoreEl");
    const timerEl = document.getElementById("timerEl");
    const targetText = document.getElementById("targetText");
    const durationSelect = document.getElementById("durationSelect");
    const summaryBanner = document.getElementById("summaryBanner");
    const summaryText = document.getElementById("summaryText");

    const pinchSlider = document.getElementById("pinchSlider");
    const pinchVal = document.getElementById("pinchVal");
    const radiusSlider = document.getElementById("radiusSlider");
    const radiusVal = document.getElementById("radiusVal");

    let pinchThreshold = parseFloat(pinchSlider.value);
    let bubbleRadius = parseInt(radiusSlider.value, 10);

    pinchSlider.addEventListener("input", () => {
      pinchThreshold = parseFloat(pinchSlider.value);
      const label = pinchThreshold >= 0.12 ? "極高" : pinchThreshold >= 0.09 ? "高" : "標準";
      pinchVal.innerText = `${label} (${pinchThreshold.toFixed(2)})`;
    });

    radiusSlider.addEventListener("input", () => {
      bubbleRadius = parseInt(radiusSlider.value, 10);
      radiusVal.innerText = `${bubbleRadius}px`;
      if (targetBubble) targetBubble.radius = bubbleRadius;
    });

    const FINGERS = [
      { id: 8,  midId: 7,  name: "食指", color: "#FF4D4D" },
      { id: 12, midId: 11, name: "中指", color: "#4DFF88" },
      { id: 16, midId: 15, name: "無名指", color: "#4DA6FF" },
      { id: 20, midId: 19, name: "尾指", color: "#FFD633" }
    ];

    let handLandmarker;
    let lastVideoTime = -1;
    let score = 0;
    let isPlaying = false;
    let isPinching = false;
    let targetBubble = null;
    let cameraStarted = false;

    let totalSeconds = parseInt(durationSelect.value, 10) * 60;
    let remainingSeconds = totalSeconds;
    let timerInterval = null;

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, "0");
      const s = (sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    durationSelect.addEventListener("change", () => {
      if (!isPlaying) {
        totalSeconds = parseInt(durationSelect.value, 10) * 60;
        remainingSeconds = totalSeconds;
        timerEl.innerText = formatTime(remainingSeconds);
      }
    });

    function playSuccessSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function playEndSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
      osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    }

    function spawnTarget() {
      const randomFinger = FINGERS[Math.floor(Math.random() * FINGERS.length)];
      targetBubble = {
        finger: randomFinger,
        x: 120 + Math.random() * (canvas.width - 240),
        y: 90 + Math.random() * (canvas.height - 210),
        radius: bubbleRadius
      };
      targetText.innerText = `移到泡泡並捏合【${randomFinger.name}】`;
      targetText.style.color = randomFinger.color;
    }

    function startSession() {
      score = 0;
      scoreEl.innerText = "0";
      totalSeconds = parseInt(durationSelect.value, 10) * 60;
      remainingSeconds = totalSeconds;
      timerEl.innerText = formatTime(remainingSeconds);
      durationSelect.disabled = true;
      summaryBanner.style.display = "none";
      restartBtn.style.display = "none";
      isPlaying = true;
      isPinching = false;
      spawnTarget();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        remainingSeconds--;
        timerEl.innerText = formatTime(remainingSeconds);
        if (remainingSeconds <= 0) {
          endSession();
        }
      }, 1000);
    }

    function endSession() {
      isPlaying = false;
      clearInterval(timerInterval);
      durationSelect.disabled = false;
      targetBubble = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      targetText.innerText = "訓練完成";
      targetText.style.color = "#38bdf8";
      playEndSound();

      const mins = totalSeconds / 60;
      const avgPerMin = (score / mins).toFixed(1);
      summaryText.innerText = `訓練時長：${mins} 分鐘 ｜ 總完成次數：${score} 次（平均每分鐘 ${avgPerMin} 次）`;
      summaryBanner.style.display = "block";
      restartBtn.style.display = "inline-block";
    }

    async function init() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.4,
        minHandPresenceConfidence: 0.4,
        minTrackingConfidence: 0.4
      });
      startBtn.disabled = false;
      startBtn.innerText = "開啟鏡頭開始雙重訓練";
    }
    init();

    startBtn.addEventListener("click", async () => {
      if (!cameraStarted) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.addEventListener("loadeddata", () => {
          cameraStarted = true;
          startSession();
          gameLoop();
        });
      } else {
        startSession();
      }
      startBtn.style.display = "none";
    });

    restartBtn.addEventListener("click", () => {
      startSession();
    });

    async function gameLoop() {
      if (lastVideoTime !== video.currentTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (isPlaying && targetBubble) {
          let isHandInsideTarget = false;

          if (results.landmarks && results.landmarks.length > 0) {
            const landmarks = results.landmarks;
            const thumb = landmarks;
            const targetTip = landmarks[targetBubble.finger.id];
            const palmCenter = landmarks;

            const checkPoints = [thumb, targetTip, palmCenter];
            const hitRadius = targetBubble.radius + 20;

            for (const pt of checkPoints) {
              const px = pt.x * canvas.width;
              const py = pt.y * canvas.height;
              if (Math.hypot(px - targetBubble.x, py - targetBubble.y) <= hitRadius) {
                isHandInsideTarget = true;
                break;
              }
            }
          }

          // 畫出目標泡泡
          ctx.beginPath();
          ctx.arc(targetBubble.x, targetBubble.y, targetBubble.radius, 0, Math.PI * 2);
          ctx.fillStyle = isHandInsideTarget ? targetBubble.finger.color : targetBubble.finger.color + "AA";
          ctx.fill();

          ctx.lineWidth = isHandInsideTarget ? 8 : 3;
          ctx.strokeStyle = isHandInsideTarget ? "#FFFFFF" : "#CBD5E1";
          ctx.stroke();

          ctx.save();
          ctx.translate(targetBubble.x, targetBubble.y);
          ctx.scale(-1, 1);
          ctx.fillStyle = "#000000";
          ctx.font = "bold 24px Microsoft JhengHei";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(targetBubble.finger.name, 0, -10);
          ctx.font = "bold 15px Microsoft JhengHei";
          ctx.fillText(isHandInsideTarget ? "✓ 已對準！請捏合" : "請伸手移入", 0, 18);
          ctx.restore();

          // 畫出手指點並檢查捏合動作
          if (results.landmarks && results.landmarks.length > 0) {
            const landmarks = results.landmarks;
            const thumb = landmarks;
            const thumbPxX = thumb.x * canvas.width;
            const thumbPxY = thumb.y * canvas.height;

            ctx.beginPath();
            ctx.arc(thumbPxX, thumbPxY, 15, 0, Math.PI * 2);
            ctx.fillStyle = "#FFFFFF";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#000000";
            ctx.stroke();

            let anyFingerTouching = false;

            for (const f of FINGERS) {
              const tip = landmarks[f.id];
              const mid = landmarks[f.midId];
              const tx = tip.x * canvas.width;
              const ty = tip.y * canvas.height;

              ctx.beginPath();
              ctx.arc(tx, ty, 13, 0, Math.PI * 2);
              ctx.fillStyle = f.color;
              ctx.fill();

              const distToTip = Math.hypot(thumb.x - tip.x, thumb.y - tip.y);
              const distToMid = Math.hypot(thumb.x - mid.x, thumb.y - mid.y);
              const minPinchDist = Math.min(distToTip, distToMid);

              if (minPinchDist < pinchThreshold) {
                anyFingerTouching = true;

                if (isHandInsideTarget && f.id === targetBubble.finger.id && !isPinching) {
                  isPinching = true;
                  score++;
                  scoreEl.innerText = score;
                  playSuccessSound();
                  spawnTarget();
                }
              }
            }

            if (!anyFingerTouching) {
              isPinching = false;
            }
          }
        }
      }
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
