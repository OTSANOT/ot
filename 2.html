    // 初始化 MediaPipe Hands 模型
    async function init() {
      try {
        debugStatus.innerText = "正在初始化 MediaPipe Hands 引擎...";
        if (typeof Hands === "undefined") {
          throw new Error("MediaPipe Hands 腳本未能載入，請檢查網路連線或 CDN 阻擋。");
        }

        handsDetector = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        handsDetector.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.55,
          minTrackingConfidence: 0.55
        });

        handsDetector.onResults((results) => {
          latestResults = results || { multiHandLandmarks: [], multiHandedness: [] };
        });

        await handsDetector.initialize();

        startBtn.disabled = false;
        startBtn.innerText = "開啟鏡頭開始雙重訓練";
        debugStatus.innerText = "✅ 模型載入完成！";
      } catch (err) {
        console.error("模型載入失敗:", err);
        startBtn.innerText = "模型載入失敗，請檢查網路並重新整理";
        debugStatus.style.color = "#f87171";
        debugStatus.innerText = `錯誤詳情：${err.message || err}`;
      }
    }
    init();

    // 開啟攝影機串流並啟動主迴圈
    startBtn.addEventListener("click", async () => {
      if (!streamStarted) {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("瀏覽器不支援攝影機存取，請使用 HTTPS 或 localhost 開啟。");
          }
          debugStatus.innerText = "正在請求攝影機權限...";
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;
          video.onloadedmetadata = async () => {
            await video.play();
            streamStarted = true;
            startBtn.style.display = "none";
            debugStatus.innerText = "";
            startSession();
            gameLoop();
          };
        } catch (err) {
          console.error("無法存取攝影機:", err);
          targetText.innerText = "無法開啟鏡頭，請檢查權限設定";
          targetText.style.color = "#f43f5e";
          debugStatus.style.color = "#f87171";
          debugStatus.innerText = `鏡頭錯誤：${err.message || err}`;
        }
      } else {
        startBtn.style.display = "none";
        startSession();
      }
    });

    restartBtn.addEventListener("click", () => {
      startSession();
    });
