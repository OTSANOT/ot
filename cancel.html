<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancellation Task Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    background: #f2f4f7;
    color: #222;
  }
  header {
    background: #1f3b63;
    color: #fff;
    padding: 18px 24px;
  }
  header h1 { margin: 0; font-size: 22px; }
  main {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 16px;
  }
  .panel {
    background: #fff;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 20px;
  }
  h2 { margin-top: 0; font-size: 18px; color: #1f3b63; }
  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
  }
  input, select, button {
    width: 100%;
    padding: 9px;
    border: 1px solid #bbb;
    border-radius: 5px;
    font-size: 14px;
  }
  button {
    background: #1f3b63;
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #2c538a; }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .actions button { width: auto; padding: 10px 18px; }
  .secondary { background: #666; }
  .secondary:hover { background: #777; }

  /* Printable worksheet */
  .worksheet {
    background: #fff;
    padding: 24px;
    border: 1px solid #ccc;
    min-height: 900px;
  }
  .worksheet h2 {
    text-align: center;
    margin: 0 0 6px;
    color: #000;
  }
  .instructions {
    text-align: center;
    font-size: 14px;
    margin-bottom: 18px;
  }
  .grid {
    display: grid;
    gap: 6px;
    justify-content: center;
  }
  .item {
    width: var(--cell-size);
    height: var(--cell-size);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--font-size);
    user-select: none;
  }
  .target {
    font-weight: bold;
    color: #b30000;
  }
  .footer {
    margin-top: 18px;
    font-size: 12px;
    color: #555;
    text-align: center;
  }

  @media print {
    body { background: #fff; }
    .no-print { display: none; }
    .worksheet {
      border: none;
      padding: 0;
      min-height: auto;
      page-break-after: avoid;
    }
  }
</style>
</head>
<body>

<header class="no-print">
  <h1>Cancellation Task Generator</h1>
</header>

<main>
  <section class="panel no-print">
    <h2>Task settings</h2>

    <div class="controls">
      <div>
        <label for="totalElements">Total number of elements</label>
        <input id="totalElements" type="number" min="20" max="400" value="120">
      </div>

      <div>
        <label for="targetPercent">Percentage of target elements (%)</label>
        <input id="targetPercent" type="number" min="1" max="50" value="15">
      </div>

      <div>
        <label for="targetSize">Target size</label>
        <select id="targetSize">
          <option value="small">Small</option>
          <option value="medium" selected>Medium</option>
          <option value="large">Large</option>
        </select>
      </div>

      <div>
        <label for="contentType">Content type</label>
        <select id="contentType">
          <option value="letters" selected>Letters</option>
          <option value="numbers">Numbers</option>
          <option value="shapes">Shapes</option>
        </select>
      </div>

      <div>
        <label for="organizationType">Organization type</label>
        <select id="organizationType">
          <option value="random" selected>Random</option>
          <option value="rows">Rows</option>
          <option value="columns">Columns</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button onclick="generateTask()">Generate task</button>
      <button class="secondary" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </section>

  <section class="worksheet" id="worksheet">
    <h2>Cancellation Task</h2>
    <p class="instructions">
      Cross out every <strong id="targetDescription">target</strong> as quickly and accurately as possible.
    </p>
    <div class="grid" id="taskGrid"></div>
    <p class="footer">Name: ____________________________ &nbsp;&nbsp; Date: ____________________</p>
  </section>
</main>

<script>
const LETTERS = "ABCDEFGHJKLMNPRSTUVWXYZ".split("");
const NUMBERS = "0123456789".split("");
const SHAPES = ["●", "■", "▲", "◆", "★", "✚"];

function getSettings() {
  return {
    total: clamp(parseInt(document.getElementById("totalElements").value || 120), 20, 400),
    percent: clamp(parseInt(document.getElementById("targetPercent").value || 15), 1, 50),
    size: document.getElementById("targetSize").value,
    contentType: document.getElementById("contentType").value,
    organization: document.getElementById("organizationType").value
  };
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function randomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function getSizeSettings(size) {
  if (size === "small") return { cell: "26px", font: "14px" };
  if (size === "large") return { cell: "46px", font: "28px" };
  return { cell: "36px", font: "20px" };
}

function generateTask() {
  const settings = getSettings();
  const targetCount = Math.max(1, Math.round(settings.total * settings.percent / 100));
  const nonTargetCount = settings.total - targetCount;

  let symbols;
  let target;

  if (settings.contentType === "numbers") {
    symbols = NUMBERS;
    target = randomItem(symbols);
  } else if (settings.contentType === "shapes") {
    symbols = SHAPES;
    target = randomItem(symbols);
  } else {
    symbols = LETTERS;
    target = randomItem(symbols);
  }

  const items = [];
  for (let i = 0; i < targetCount; i++) items.push(target);

  for (let i = 0; i < nonTargetCount; i++) {
    let symbol;
    do {
      symbol = randomItem(symbols);
    } while (symbol === target);
    items.push(symbol);
  }

  if (settings.organization === "rows") {
    items.sort((a, b) => (a === target ? -1 : b === target ? 1 : 0));
  } else if (settings.organization === "columns") {
    items.sort(() => Math.random() - 0.5);
    const targetItems = items.filter(item => item === target);
    const otherItems = items.filter(item => item !== target);
    const arranged = [];

    while (targetItems.length || otherItems.length) {
      if (targetItems.length) arranged.push(targetItems.pop());
      for (let i = 0; i < 4 && otherItems.length; i++) {
        arranged.push(otherItems.pop());
      }
    }
    items.length = 0;
    items.push(...arranged);
  } else {
    items.sort(() => Math.random() - 0.5);
  }

  renderWorksheet(items, target, settings);
}

function renderWorksheet(items, target, settings) {
  const grid = document.getElementById("taskGrid");
  const sizeSettings = getSizeSettings(settings.size);

  grid.style.setProperty("--cell-size", sizeSettings.cell);
  grid.style.setProperty("--font-size", sizeSettings.font);

  const columns = settings.organization === "columns" ? 10 : 12;
  grid.style.gridTemplateColumns = `repeat(${columns}, ${sizeSettings.cell})`;

  grid.innerHTML = "";

  items.forEach(symbol => {
    const cell = document.createElement("div");
    cell.className = "item" + (symbol === target ? " target" : "");
    cell.textContent = symbol;
    grid.appendChild(cell);
  });

  const targetName =
    settings.contentType === "shapes" ? "target shape" :
    settings.contentType === "numbers" ? `number ${target}` :
    `letter ${target}`;

  document.getElementById("targetDescription").textContent = targetName;
}

generateTask();
</script>

</body>
</html>
