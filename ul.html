<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upper Limb & Hand Motion Tracker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      position: relative;
      width: 640px;
      height: 480px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      background: #000;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    .controls {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #00e676;
      color: #000;
      transition: opacity 0.2s;
    }
    button:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
    }
    button.record-btn { background-color: #ff1744; color: #fff; }
    button.export-btn { background-color: #2979ff; color: #fff; }
    .dashboard {
      margin-top: 15px;
      width: 640px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .card h4 { margin: 0 0 8px 0; color: #00e676; font-family: sans-serif; }
  </style>
</head>
<body>

  <h2>Upper Limb & Hand Kinematics Tracker</h2>
  
  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="controls">
    <button id="webcamButton" disabled>Loading AI Models...</button>
    <button id="recordButton" class="record-btn" disabled>Start Recording</button>
    <button id="exportCsvButton" class="export-btn" disabled>Download CSV</button>
    <button id="exportJsonButton" class="export-btn" disabled>Download JSON</button>
  </div>
  <p id="status" style="font-size: 13px; color: #aaa;">Initializing Pose & Hand models...</p>

  <div class="dashboard">
    <div class="card" id="left-metrics">
      <h4>Left Upper Limb</h4>
      Elbow Flexion: --°<br>
      Shoulder Elevation: --°<br>
      Hand Status: Not detected
    </div>
    <div class="card" id="right-metrics">
      <h4>Right Upper Limb</h4>
      Elbow Flexion: --°<br>
      Shoulder Elevation: --°<br>
      Hand Status: Not detected
    </div>
  </div>

  <script type="module">
    import {
      PoseLandmarker,
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("webcam");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    const webcamBtn = document.getElementById("webcamButton");
    const recordBtn = document.getElementById("recordButton");
    const exportCsvBtn = document.getElementById("exportCsvButton");
    const exportJsonBtn = document.getElementById("exportJsonButton");
    const statusText = document.getElementById("status");
    const leftMetrics = document.getElementById("left-metrics");
    const rightMetrics = document.getElementById("right-metrics");

    let poseLandmarker, handLandmarker;
    let webcamRunning = false;
    let isRecording = false;
    let lastVideoTime = -1;
    let recordedData = [];

    // Pose Connections (Shoulders, Arms, Torso reference for shoulder elevation)
    const POSE_CONNECTIONS = [
      [11, 12], // Shoulders
      [11, 13], [13, 15], // Left Arm
      [12, 14], [14, 16], // Right Arm
      [11, 23], [12, 24]  // Torso sides
    ];

    // 21-Point Hand Connections
    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],       // Thumb
      [0, 5], [5, 6], [6, 7], [7, 8],       // Index
      [5, 9], [9, 10], [10, 11], [11, 12],  // Middle
      [9, 13], [13, 14], [14, 15], [15, 16],// Ring
      [13, 17], [17, 18], [18, 19], [19, 20],// Pinky
      [0, 17]                               // Palm
    ];

    // 1. Load Both AI Models
    async function initModels() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 1
      });

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });

      webcamBtn.disabled = false;
      webcamBtn.innerText = "Start Tracking";
      statusText.innerText = "Models ready. Click 'Start Tracking'.";
    }
    initModels();

    // 2. Calculate 3D Angle (in degrees) at vertex B between points A-B-C
    function calculate3DAngle(a, b, c) {
      if (!a || !b || !c) return null;
      const v1 = { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
      const v2 = { x: c.x - b.x, y: c.y - b.y, z: c.z - b.z };
      
      const dot = v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
      const mag1 = Math.sqrt(v1.x**2 + v1.y**2 + v1.z**2);
      const mag2 = Math.sqrt(v2.x**2 + v2.y**2 + v2.z**2);
      
      if (mag1 === 0 || mag2 === 0) return 0;
      const cosTheta = Math.max(-1, Math.min(1, dot / (mag1 * mag2)));
      return (Math.acos(cosTheta) * (180 / Math.PI));
    }

    // 3. Webcam Toggle
    webcamBtn.addEventListener("click", () => {
      if (webcamRunning) {
        webcamRunning = false;
        webcamBtn.innerText = "Start Tracking";
        recordBtn.disabled = true;
      } else {
        webcamRunning = true;
        webcamBtn.innerText = "Pause Tracking";
        recordBtn.disabled = false;
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
          .then((stream) => {
            video.srcObject = stream;
            video.addEventListener("loadeddata", predictWebcam);
          });
      }
    });

    // 4. Recording Toggle
    recordBtn.addEventListener("click", () => {
      isRecording = !isRecording;
      if (isRecording) {
        recordedData = [];
        recordBtn.innerText = "Stop Recording";
        exportCsvBtn.disabled = true;
        exportJsonBtn.disabled = true;
        statusText.innerText = "Recording telemetry...";
      } else {
        recordBtn.innerText = "Start Recording";
        const hasData = recordedData.length > 0;
        exportCsvBtn.disabled = !hasData;
        exportJsonBtn.disabled = !hasData;
        statusText.innerText = `Recorded ${recordedData.length} frames.`;
      }
    });

    // 5. Main Tracking Loop
    async function predictWebcam() {
      canvasElement.width = video.videoWidth;
      canvasElement.height = video.videoHeight;

      if (webcamRunning && lastVideoTime !== video.currentTime) {
        lastVideoTime = video.currentTime;
        const startTimeMs = performance.now();

        const poseResult = poseLandmarker.detectForVideo(video, startTimeMs);
        const handResult = handLandmarker.detectForVideo(video, startTimeMs);

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        let frameMetrics = {
          timestamp_ms: Math.round(startTimeMs),
          left_elbow_deg: null,
          left_shoulder_deg: null,
          right_elbow_deg: null,
          right_shoulder_deg: null,
          hands: []
        };

        // Process Pose & Joint Angles
        if (poseResult.landmarks && poseResult.landmarks.length > 0) {
          const lm = poseResult.landmarks[0];
          const wlm = poseResult.worldLandmarks[0]; // Real-world 3D meters for accurate angles

          // Draw Arm Skeleton
          canvasCtx.strokeStyle = "#00e676";
          canvasCtx.lineWidth = 4;
          POSE_CONNECTIONS.forEach(([i, j]) => {
            canvasCtx.beginPath();
            canvasCtx.moveTo(lm[i].x * canvasElement.width, lm[i].y * canvasElement.height);
            canvasCtx.lineTo(lm[j].x * canvasElement.width, lm[j].y * canvasElement.height);
            canvasCtx.stroke();
          });

          // Calculate Angles using 3D World Landmarks
          // Elbow Flexion: 180 - internal angle (0° = straight arm, 145° = fully bent)
          const leftElbowRaw = calculate3DAngle(wlm[11], wlm[13], wlm[15]);
          const rightElbowRaw = calculate3DAngle(wlm[12], wlm[14], wlm[16]);
          const leftElbowFlex = leftElbowRaw !== null ? (180 - leftElbowRaw).toFixed(1) : "--";
          const rightElbowFlex = rightElbowRaw !== null ? (180 - rightElbowRaw).toFixed(1) : "--";

          // Shoulder Elevation: Angle between Hip(23/24) - Shoulder(11/12) - Elbow(13/14)
          const leftShoulderElev = calculate3DAngle(wlm[23], wlm[11], wlm[13])?.toFixed(1) || "--";
          const rightShoulderElev = calculate3DAngle(wlm[24], wlm[12], wlm[14])?.toFixed(1) || "--";

          frameMetrics.left_elbow_deg = leftElbowFlex;
          frameMetrics.left_shoulder_deg = leftShoulderElev;
          frameMetrics.right_elbow_deg = rightElbowFlex;
          frameMetrics.right_shoulder_deg = rightShoulderElev;

          leftMetrics.innerHTML = `
            <h4>Left Upper Limb</h4>
            Elbow Flexion: <strong>${leftElbowFlex}°</strong><br>
            Shoulder Elevation: <strong>${leftShoulderElev}°</strong><br>
            Hands Tracked: ${handResult.landmarks.length}
          `;
          rightMetrics.innerHTML = `
            <h4>Right Upper Limb</h4>
            Elbow Flexion: <strong>${rightElbowFlex}°</strong><br>
            Shoulder Elevation: <strong>${rightShoulderElev}°</strong><br>
            Hands Tracked: ${handResult.landmarks.length}
          `;
        }

        // Process 21-Point Hands
        if (handResult.landmarks && handResult.landmarks.length > 0) {
          handResult.landmarks.forEach((handLm, idx) => {
            const handedness = handResult.handednesses[idx][0].categoryName;
            frameMetrics.hands.push({ side: handedness, landmarks: handLm });

            // Draw Finger Connections
            canvasCtx.strokeStyle = "#2979ff";
            canvasCtx.lineWidth = 2;
            HAND_CONNECTIONS.forEach(([i, j]) => {
              canvasCtx.beginPath();
              canvasCtx.moveTo(handLm[i].x * canvasElement.width, handLm[i].y * canvasElement.height);
              canvasCtx.lineTo(handLm[j].x * canvasElement.width, handLm[j].y * canvasElement.height);
              canvasCtx.stroke();
            });

            // Draw 21 Finger Joints
            canvasCtx.fillStyle = "#ffea00";
            handLm.forEach((pt) => {
              canvasCtx.beginPath();
              canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 3, 0, 2 * Math.PI);
              canvasCtx.fill();
            });
          });
        }

        if (isRecording) {
          recordedData.push(frameMetrics);
        }

        canvasCtx.restore();
      }

      if (webcamRunning) {
        window.requestAnimationFrame(predictWebcam);
      }
    }

    // 6. Export Functions (JSON & CSV)
    exportJsonBtn.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(recordedData, null, 2)], { type: "application/json" });
      triggerDownload(blob, "upper_limb_motion.json");
    });

    exportCsvBtn.addEventListener("click", () => {
      const headers = [
        "timestamp_ms", "left_elbow_deg", "left_shoulder_deg", 
        "right_elbow_deg", "right_shoulder_deg", "hands_detected", "hand_landmarks_json"
      ];
      const rows = recordedData.map(row => [
        row.timestamp_ms,
        row.left_elbow_deg,
        row.left_shoulder_deg,
        row.right_elbow_deg,
        row.right_shoulder_deg,
        row.hands.length,
        `"${JSON.stringify(row.hands).replace(/"/g, '""')}"`
      ].join(","));

      const csvContent = [headers.join(","), ...rows].join("\n");
      const blob = new Blob([csvContent], { type: "text/csv" });
      triggerDownload(blob, "upper_limb_motion.csv");
    });

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
