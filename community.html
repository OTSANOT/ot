<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 職業治療社區生活訓練小鎮</title>
    <!-- Tailwind CSS for crisp UI overlays -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
        /* Custom animations for UI */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
            50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(59, 130, 246, 0.8); }
        }
        .interact-btn {
            animation: pulseGlow 2s infinite ease-in-out;
        }
        #joystick-zone {
            touch-action: none;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <!-- Top HUD Bar -->
    <div class="absolute top-0 left-0 right-0 p-3 sm:p-4 flex flex-wrap justify-between items-start pointer-events-none z-10 gap-2">
        <!-- Title, Controls & OT Mission Tracker -->
        <div class="flex flex-col gap-2 pointer-events-auto max-w-xs sm:max-w-sm">
            <div class="bg-slate-900/90 backdrop-blur-md text-white p-3.5 rounded-2xl border border-slate-700/70 shadow-xl">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-teal-400 animate-pulse"></span>
                        <h1 class="font-bold text-sm sm:text-base tracking-tight">OT 社區生活技能訓練</h1>
                    </div>
                    <span id="ot-score-badge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-teal-500/20 text-teal-300 border border-teal-500/40">
                        完成度 0/5
                    </span>
                </div>
                <p class="text-[11px] text-slate-300 mt-1 leading-relaxed hidden sm:block">
                    用 <kbd class="px-1 py-0.5 bg-slate-800 rounded border border-slate-600">WASD</kbd> 行路，行近發光無障礙入口按 <kbd class="px-1 py-0.5 bg-slate-800 rounded border border-slate-600">E</kbd> 進行社區任務訓練。
                </p>

                <!-- Collapsible OT IADL Checklist -->
                <div class="mt-2.5 pt-2.5 border-t border-slate-800">
                    <button onclick="toggleChecklist()" class="w-full flex items-center justify-between text-xs font-semibold text-teal-300 hover:text-teal-200 transition">
                        <span>📋 今日社區復康任務 (IADL)</span>
                        <span id="checklist-arrow">▼</span>
                    </button>
                    <div id="ot-checklist" class="mt-2 space-y-1.5 text-xs">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Controls: Quick Teleport & Mobility Mode -->
        <div class="flex flex-col items-end gap-2 pointer-events-auto">
            <!-- Quick Teleport / Fast Travel Bar -->
            <div class="bg-slate-900/90 backdrop-blur-md p-2 rounded-2xl border border-slate-700/70 shadow-xl flex flex-wrap gap-1.5 justify-end">
                <button onclick="teleportTo('bank')" class="px-2.5 py-1.5 text-xs font-semibold rounded-xl bg-blue-600/20 hover:bg-blue-600 text-blue-200 hover:text-white border border-blue-500/40 transition flex items-center gap-1">
                    <span>🏦</span><span class="hidden md:inline">銀行</span>
                </button>
                <button onclick="teleportTo('supermarket')" class="px-2.5 py-1.5 text-xs font-semibold rounded-xl bg-emerald-600/20 hover:bg-emerald-600 text-emerald-200 hover:text-white border border-emerald-500/40 transition flex items-center gap-1">
                    <span>🛒</span><span class="hidden md:inline">超市</span>
                </button>
                <button onclick="teleportTo('fastfood')" class="px-2.5 py-1.5 text-xs font-semibold rounded-xl bg-amber-600/20 hover:bg-amber-600 text-amber-200 hover:text-white border border-amber-500/40 transition flex items-center gap-1">
                    <span>🍔</span><span class="hidden md:inline">快餐店</span>
                </button>
                <button onclick="teleportTo('chinese')" class="px-2.5 py-1.5 text-xs font-semibold rounded-xl bg-red-600/20 hover:bg-red-600 text-red-200 hover:text-white border border-red-500/40 transition flex items-center gap-1">
                    <span>🏮</span><span class="hidden md:inline">中菜館</span>
                </button>
                <button onclick="teleportTo('daycenter')" class="px-2.5 py-1.5 text-xs font-semibold rounded-xl bg-purple-600/20 hover:bg-purple-600 text-purple-200 hover:text-white border border-purple-500/40 transition flex items-center gap-1">
                    <span>☀️</span><span class="hidden md:inline">日間中心</span>
                </button>
            </div>

            <!-- Mobility & Accessibility Toggle (Walking vs Wheelchair Mode) -->
            <div class="flex gap-1.5">
                <button id="mobility-toggle-btn" onclick="toggleWheelchairMode()" class="bg-slate-900/90 hover:bg-slate-800 text-white px-3.5 py-2 rounded-2xl border border-teal-500/40 shadow-lg text-xs font-semibold flex items-center gap-2 transition">
                    <span id="mobility-icon">🚶</span>
                    <span id="mobility-label">步行模式</span>
                </button>
                <button onclick="openOTSummaryModal()" class="bg-teal-600/90 hover:bg-teal-500 text-white px-3.5 py-2 rounded-2xl border border-teal-400/50 shadow-lg text-xs font-semibold flex items-center gap-1.5 transition">
                    <span>🩺</span>
                    <span>治療師評估</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Right Status & Day/Night -->
    <div class="absolute bottom-4 right-4 z-10 flex flex-col items-end gap-2 pointer-events-none">
        <!-- Player Status Pill -->
        <div class="bg-slate-900/85 backdrop-blur-md text-slate-200 text-xs px-3.5 py-2 rounded-2xl border border-slate-700/70 flex items-center gap-3 shadow-lg">
            <span title="銀包現金">💵 <strong id="hud-wallet" class="text-emerald-400">$250</strong></span>
            <span class="text-slate-600">|</span>
            <span title="精力值（能量管理）">⚡ <strong id="hud-energy" class="text-amber-400">100%</strong></span>
        </div>
        <div class="flex items-center gap-2 pointer-events-auto">
            <div id="coords-display" class="bg-slate-900/75 backdrop-blur-sm text-slate-300 text-xs px-3 py-2 rounded-xl border border-slate-700/60 font-mono">
                社區廣場
            </div>
            <button id="time-toggle-btn" onclick="toggleDayNight()" class="bg-slate-900/90 hover:bg-slate-800 text-white px-3.5 py-2 rounded-2xl border border-slate-700 shadow-lg text-xs font-semibold flex items-center gap-1.5 transition">
                <span id="time-icon">☀️</span>
                <span id="time-label">日頭</span>
            </button>
        </div>
    </div>

    <!-- Proximity Interaction Prompt (Appears near doors) -->
    <div id="proximity-prompt" class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 z-20">
        <button id="enter-place-btn" onclick="openCurrentPlaceModal()" class="interact-btn bg-teal-600 hover:bg-teal-500 text-white font-bold px-6 py-3 rounded-2xl shadow-2xl border-2 border-white/30 flex items-center gap-3 text-sm sm:text-base transition cursor-pointer">
            <span id="prompt-icon" class="text-xl">🚪</span>
            <div class="text-left">
                <div id="prompt-title" class="leading-tight">進入建築物</div>
                <div class="text-[11px] font-normal text-teal-100">撳掣或者按 [E] 開始職業治療訓練</div>
            </div>
        </button>
    </div>

    <!-- Mobile Touch Virtual Joystick -->
    <div id="joystick-zone" class="sm:hidden absolute bottom-6 left-6 w-28 h-28 rounded-full bg-slate-900/50 backdrop-blur-sm border-2 border-white/20 flex items-center justify-center z-20">
        <div id="joystick-knob" class="w-11 h-11 rounded-full bg-white/80 shadow-lg pointer-events-none transition-transform duration-75"></div>
    </div>

    <!-- Building Interior / OT Training Modal -->
    <div id="place-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 text-white rounded-3xl max-w-lg w-full p-6 shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div class="flex items-center gap-3">
                    <div id="modal-badge" class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-blue-600/20 border border-blue-500/40">
                        🏦
                    </div>
                    <div>
                        <h2 id="modal-title" class="text-xl font-extrabold tracking-tight">都會第一銀行</h2>
                        <p id="modal-subtitle" class="text-xs text-teal-400 font-semibold">OT 訓練目標：財務管理與安全提款</p>
                    </div>
                </div>
                <button onclick="closePlaceModal()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center font-bold transition">
                    ✕
                </button>
            </div>

            <div id="modal-body" class="py-4 space-y-4 text-sm text-slate-300">
                <!-- Dynamic OT Task & Scenario injected via JS -->
            </div>

            <div id="modal-feedback" class="hidden mb-4 p-3.5 rounded-2xl bg-teal-500/20 border border-teal-500/40 text-teal-200 text-xs leading-relaxed font-medium">
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                <button onclick="closePlaceModal()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm transition">
                    完成並返回社區
                </button>
            </div>
        </div>
    </div>

    <!-- OT Therapist Assessment Summary Modal -->
    <div id="ot-summary-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-teal-500/40 text-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-teal-600/20 border border-teal-500/40 flex items-center justify-center text-2xl">
                        🩺
                    </div>
                    <div>
                        <h2 class="text-lg font-extrabold">職業治療師社區評估報告</h2>
                        <p class="text-xs text-slate-400">IADL 獨立生活能力及環境適應觀察</p>
                    </div>
                </div>
                <button onclick="closeOTSummaryModal()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center font-bold">✕</button>
            </div>
            <div id="ot-summary-content" class="py-4 space-y-3 text-xs text-slate-300">
                <!-- Dynamic assessment injected via JS -->
            </div>
            <div class="flex justify-end pt-2 border-t border-slate-800">
                <button onclick="closeOTSummaryModal()" class="px-5 py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-semibold text-xs transition">
                    繼續訓練
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * 3D Occupational Therapy (OT) Community Living Skills Training World
 * Incorporates:
 * - Instrumental Activities of Daily Living (IADL) tasks across 5 community locations:
 *   1. Bank: Financial management, ATM security, budgeting
 *   2. Supermarket: Shopping list cognitive recall, nutrition & price comparison
 *   3. Fast Food: Self-service ordering, pacing & energy conservation
 *   4. Chinese Restaurant: Fine motor / adaptive utensils (chopsticks/spoon), social dining & dysphagia awareness
 *   5. Day Center: Cognitive stimulation, joint protection & fall prevention workshop
 * - Assistive Mobility Toggle: Walking Mode vs. Wheelchair Mode (with accessible ramps & lower eye-level perspective)
 */

// --- Global State & Variables ---
let scene, camera, renderer;
let playerGroup, playerBody, playerHead, leftLeg, rightLeg, leftArm, rightArm, wheelchairGroup;
let clock = new THREE.Clock();

// Player Movement, OT Metrics & Physics
const playerState = {
    x: 0,
    z: 18,
    rotationY: Math.PI,
    speed: 14,
    walkCycle: 0,
    wallet: 250,
    energy: 100,
    isWheelchair: false,
    completedTasks: {
        bank: false,
        supermarket: false,
        fastfood: false,
        chinese: false,
        daycenter: false
    },
    otNotes: []
};

// Camera Orbit State
const cameraState = {
    yaw: 0,
    pitch: 0.42,
    distance: 22,
    isDragging: false,
    prevMouseX: 0,
    prevMouseY: 0
};

// Input Tracking
const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
const joystick = { active: false, dx: 0, dy: 0 };

// World Objects & Colliders
const colliders = [];
const interactiveZones = [];
const animatedObjects = [];
let currentNearbyPlace = null;
let isNight = false;
let checklistExpanded = true;
let ambientLight, sunLight, hemiLight;
const streetLights = [];

// OT IADL Missions & Clinical Scenarios for each of the 5 places
const PLACES_DATA = {
    bank: {
        id: 'bank',
        name: '都會第一銀行',
        shortTask: '銀行：理財預算與提款安全',
        otDomain: 'IADL 財務管理 • 認知執行功能',
        icon: '🏦',
        badgeClass: 'bg-blue-600/20 border-blue-500/40 text-blue-300',
        description: '【職業治療情境】今日要去超市買餸同飲茶，首先要喺銀行櫃員機（ATM）提取適量現金，並確保密碼遮擋安全。注意：無障礙櫃員機設於入口斜道旁，方便輪椅使用者操作。',
        otTip: '💡 OT 小貼士：分次提取小額現金並將紙幣按面額分類放入銀包，有助減低遺失風險及方便找續計算。',
        actions: [
            {
                label: '✅ 遮擋鍵盤並提取 $100 買餸預算（完成訓練）',
                isTaskComplete: true,
                effect: () => {
                    playerState.wallet += 100;
                    adjustEnergy(-5);
                    markTaskComplete('bank', '安全提取 $100 現金並做好預算分類');
                    return '做得好！你已遮擋鍵盤安全提取 $100，並按面額放好紙幣。銀包現有：$' + playerState.wallet;
                }
            },
            {
                label: '📊 核對月結單與日常開支預算',
                isTaskComplete: false,
                effect: () => {
                    adjustEnergy(-3);
                    return '你仔細核對咗今個月嘅水電煤同飲食開支，培養良好理財習慣！';
                }
            }
        ]
    },
    supermarket: {
        id: 'supermarket',
        name: '鮮活超級市場',
        shortTask: '超市：購物清單記憶與格價',
        otDomain: 'IADL 購物能力 • 工作記憶與視覺搜尋',
        icon: '🛒',
        badgeClass: 'bg-emerald-600/20 border-emerald-500/40 text-emerald-300',
        description: '【職業治療情境】治療師畀咗張購物清單你：需要買「低糖高纖生果」同「日常糧油」。超市通道已加闊至 1.5 米，方便輪椅或助行架轉彎。',
        otTip: '💡 OT 小貼士：購物前寫低清單並按貨架分區排列，可以減少來回行路消耗體力（能量保存技巧）。',
        actions: [
            {
                label: '✅ 按清單選購「新鮮蘋果＋燕麥片」($35)（完成訓練）',
                isTaskComplete: true,
                effect: () => {
                    const res = spendMoney(35, '健康購物籃');
                    if (res.ok) {
                        adjustEnergy(-8);
                        markTaskComplete('supermarket', '按購物清單揀選高纖營養食品並自行找續');
                        return `任務完成！你成功根據清單搵到低糖高纖食品並自行付款（找續正確）。銀包剩餘：$${playerState.wallet}`;
                    }
                    return res.msg;
                }
            },
            {
                label: '🏷️ 練習比較兩款食油嘅營養標籤與價錢',
                isTaskComplete: false,
                effect: () => {
                    adjustEnergy(-4);
                    return '你成功睇清楚營養標籤上嘅鈉含量同到期日，揀咗最健康嘅一款！';
                }
            }
        ]
    },
    fastfood: {
        id: 'fastfood',
        name: '漢堡爆棚快餐店',
        shortTask: '快餐店：自助點餐與端盤平衡',
        otDomain: '社區參與 • 上肢穩定度與能量管理',
        icon: '🍔',
        badgeClass: 'bg-amber-600/20 border-amber-500/40 text-amber-300',
        description: '【職業治療情境】行咗一輪街有啲攰，入嚟叫份輕食補充體力。自助點餐機設有「輪椅低身螢幕模式」，點餐後需要雙手穩妥端托盤返座位。',
        otTip: '💡 OT 小貼士：端托盤時將較重嘅飲品放喺托盤中央，雙手肘貼近身體兩側，可以大大提高穩定性！',
        actions: [
            {
                label: '✅ 使用無障礙點餐機叫餐並雙手穩端托盤 ($18)（完成訓練）',
                isTaskComplete: true,
                effect: () => {
                    const res = spendMoney(18, '營養輕食餐');
                    if (res.ok) {
                        adjustEnergy(15);
                        markTaskComplete('fastfood', '操作無障礙點餐機並安全端盤就座');
                        return `任務完成！你將飲品放喺托盤中間平穩行返座位，食完補充咗 +15% 精力！銀包剩餘：$${playerState.wallet}`;
                    }
                    return res.msg;
                }
            },
            {
                label: '🪑 坐低做 2 分鐘深呼吸能量保存休息',
                isTaskComplete: false,
                effect: () => {
                    adjustEnergy(10);
                    return '透過腹式呼吸放鬆肩頸肌肉，精力恢復咗 +10%！';
                }
            }
        ]
    },
    chinese: {
        id: 'chinese',
        name: '金龍酒家（中菜館）',
        shortTask: '中菜館：輔具進食與社交互動',
        otDomain: 'ADL 進食技巧 • 精細動作與社交溝通',
        icon: '🏮',
        badgeClass: 'bg-red-600/20 border-red-500/40 text-red-300',
        description: '【職業治療情境】同街坊一齊飲茶！練習使用「防滑餐墊」同「加粗手柄輔助筷子／湯匙」夾點心，同時留意細啖慢嚥（吞嚥安全）。',
        otTip: '💡 OT 小貼士：如果手指靈活度未完全恢復，使用彈簧輔助筷子或彎曲手柄湯匙可以減輕手部關節負擔。',
        actions: [
            {
                label: '✅ 使用輔助餐具歎一盅兩件（蝦餃＋香片）($28)（完成訓練）',
                isTaskComplete: true,
                effect: () => {
                    const res = spendMoney(28, '點心茶餐');
                    if (res.ok) {
                        adjustEnergy(20);
                        markTaskComplete('chinese', '運用輔助餐具安全進食點心並與街坊社交');
                        return `任務完成！你用輔助筷子穩陣夾起點心，細啖慢嚥又同街坊傾得開心，精力 +20%！銀包剩餘：$${playerState.wallet}`;
                    }
                    return res.msg;
                }
            },
            {
                label: '🫖 練習單手/雙手穩定倒茶（關節保護技巧）',
                isTaskComplete: false,
                effect: () => {
                    adjustEnergy(-2);
                    return '你用雙手托住茶壺蓋同壺柄穩定倒茶，成功避免手腕過度用力！';
                }
            }
        ]
    },
    daycenter: {
        id: 'daycenter',
        name: '陽光社區日間中心',
        shortTask: '日間中心：認知訓練與防跌工作坊',
        otDomain: '復康訓練 • 認知刺激與家居防跌',
        icon: '☀️',
        badgeClass: 'bg-purple-600/20 border-purple-500/40 text-purple-300',
        description: '【職業治療情境】歡迎返到陽光日間中心！職業治療師正帶領「上肢肌力與精細動作工作坊」以及「社區防跌安全講座」。',
        otTip: '💡 OT 小貼士：行路或推輪椅經過斜道時保持身體重心穩定，穿著防滑鞋跟鞋款可減低跌倒風險。',
        actions: [
            {
                label: '✅ 參加「精細動作拼貼＋防跌安全評估」（完成訓練）',
                isTaskComplete: true,
                effect: () => {
                    adjustEnergy(10);
                    markTaskComplete('daycenter', '完成上肢精細動作訓練及防跌安全知識評估');
                    return '任務完成！治療師讚你手眼協調表現出色，仲幫你調校好出行步姿！精力 +10%';
                }
            },

function spendMoney(cost, item) {
    if (playerState.wallet >= cost) {
        playerState.wallet -= cost;
        updateHUD();
        return { ok: true };
    } else {
        return {
            ok: false,
            msg: `銀包現金唔夠（需要 $${cost}，現有 $${playerState.wallet}）！請先去「都會第一銀行」進行提款訓練。`
        };
    }
}

function adjustEnergy(delta) {
    playerState.energy = Math.max(10, Math.min(100, playerState.energy + delta));
    updateHUD();
}

function markTaskComplete(placeId, noteText) {
    if (!playerState.completedTasks[placeId]) {
        playerState.completedTasks[placeId] = true;
        playerState.otNotes.push(`✓ [${PLACES_DATA[placeId].name}] ${noteText}`);
        renderChecklist();
    }
}

function updateHUD() {
    document.getElementById('hud-wallet').textContent = '$' + playerState.wallet;
    document.getElementById('hud-energy').textContent = playerState.energy + '%';
}

function renderChecklist() {
    const container = document.getElementById('ot-checklist');
    const keysOrder = ['bank', 'supermarket', 'fastfood', 'chinese', 'daycenter'];
    let doneCount = 0;

    container.innerHTML = keysOrder.map(k => {
        const done = playerState.completedTasks[k];
        if (done) doneCount++;
        const item = PLACES_DATA[k];
        return `
            <div onclick="teleportTo('${k}')" class="cursor-pointer flex items-center justify-between px-2 py-1 rounded-lg ${done ? 'bg-teal-500/15 text-teal-300' : 'bg-slate-800/60 text-slate-300 hover:bg-slate-800'} transition">
                <span class="truncate">${done ? '✅' : '⬜'} ${item.shortTask}</span>
                <span class="text-[10px] text-slate-400 ml-1 shrink-0">前往→</span>
            </div>
        `;
    }).join('');

    document.getElementById('ot-score-badge').textContent = `完成度 ${doneCount}/5`;
}

function toggleChecklist() {
    checklistExpanded = !checklistExpanded;
    const el = document.getElementById('ot-checklist');
    const arrow = document.getElementById('checklist-arrow');
    if (checklistExpanded) {
        el.classList.remove('hidden');

// --- Helper: Generate Procedural Signage Texture ---
function createSignTexture(text, subtext, bgColor, textColor, borderColor = '#ffffff') {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 160;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 10;
    ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);

    ctx.fillStyle = textColor;
    ctx.font = 'bold 44px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, canvas.width / 2, subtext ? 62 : 80);

    if (subtext) {
        ctx.font = '600 22px Inter, sans-serif';
        ctx.fillStyle = borderColor;
        ctx.fillText(subtext, canvas.width / 2, 114);
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    return texture;
}

    });
}

// --- Helper: Accessible Ramp & Handrails for Buildings (無障礙斜道與扶手) ---
function addAccessibleRamp(group, localZ, height = 0.8) {
    const rampGroup = new THREE.Group();
    rampGroup.position.set(0, 0, localZ);

    // Sloped Ramp Surface
    const slopeGeo = new THREE.BoxGeometry(3.4, 0.2, 3.6);
    const slopeMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.6 });
    const slope = new THREE.Mesh(slopeGeo, slopeMat);
    slope.position.set(0, height / 2, 0);
    slope.rotation.x = Math.atan2(height, 3.4);
    slope.receiveShadow = true;
    rampGroup.add(slope);

    // Safety Handrails on both sides
    const railMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.6, roughness: 0.3 });
    [-1.65, 1.65].forEach(rx => {
        const post1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.1, 8), railMat);
        post1.position.set(rx, 0.55, 1.4);
        rampGroup.add(post1);

        const post2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.1, 8), railMat);
        post2.position.set(rx, 0.55 + height, -1.4);
        rampGroup.add(post2);

        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 3.2, 8), railMat);
        bar.position.set(rx, 1.05 + height / 2, 0);
        bar.rotation.x = Math.PI / 2 + Math.atan2(height, 3.0);
        rampGroup.add(bar);
    });

    group.add(rampGroup);
}

// --- Event Listeners ---
function setupEventListeners() {
    window.addEventListener('resize', onWindowResize);

    window.addEventListener('keydown', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        if ((e.key === 'e' || e.key === 'E' || e.key === ' ') && currentNearbyPlace) {
            const modal = document.getElementById('place-modal');
            if (modal.classList.contains('hidden')) {
                openCurrentPlaceModal();
            } else {
                closePlaceModal();
            }
        }
        if (e.key === 'Escape') {
            closePlaceModal();
            closeOTSummaryModal();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    const domElem = renderer.domElement;
    domElem.addEventListener('mousedown', (e) => {
        cameraState.isDragging = true;
        cameraState.prevMouseX = e.clientX;
        cameraState.prevMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => {
        cameraState.isDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
        if (!cameraState.isDragging) return;
        const dx = e.clientX - cameraState.prevMouseX;
        const dy = e.clientY - cameraState.prevMouseY;
        cameraState.prevMouseX = e.clientX;
        cameraState.prevMouseY = e.clientY;

        cameraState.yaw -= dx * 0.007;
        cameraState.pitch = Math.max(0.15, Math.min(1.15, cameraState.pitch + dy * 0.006));
    });

    domElem.addEventListener('wheel', (e) => {
        cameraState.distance = Math.max(10, Math.min(45, cameraState.distance + e.deltaY * 0.015));
    }, { passive: true });

    let touchOrbitId = null;
    domElem.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            touchOrbitId = e.touches[0].identifier;
            cameraState.prevMouseX = e.touches[0].clientX;
            cameraState.prevMouseY = e.touches[0].clientY;
        }
    }, { passive: true });

    domElem.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (t.identifier === touchOrbitId) {
                const dx = t.clientX - cameraState.prevMouseX;
                const dy = t.clientY - cameraState.prevMouseY;
                cameraState.prevMouseX = t.clientX;
                cameraState.prevMouseY = t.clientY;
                cameraState.yaw -= dx * 0.008;
                cameraState.pitch = Math.max(0.15, Math.min(1.15, cameraState.pitch + dy * 0.007));
            }
        }
    }, { passive: true });

    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    const maxRadius = 36;

    function handleJoystickMove(clientX, clientY) {
        const rect = joyZone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        let dx = clientX - centerX;
        let dy = clientY - centerY;
        const dist = Math.hypot(dx, dy);

        if (dist > maxRadius) {
            dx = (dx / dist) * maxRadius;
            dy = (dy / dist) * maxRadius;
        }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystick.dx = dx / maxRadius;
        joystick.dy = dy / maxRadius;
    }

    joyZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        joystick.active = true;
        handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    joyZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (joystick.active) {
            handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: false });

    joyZone.addEventListener('touchend', () => {
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
        joyKnob.style.transform = `translate(0px, 0px)`;
    });
}

function onWindowResize() {

// --- Collision Check ---
function checkCollision(nx, nz) {
    if (Math.abs(nx) > 85 || Math.abs(nz) > 85) return true;
    for (let i = 0; i < colliders.length; i++) {
        const c = colliders[i];
        if (nx > c.minX && nx < c.maxX && nz > c.minZ && nz < c.maxZ) {
            return true;
        }
    }
    return false;
}

// --- Main Animation & Simulation Loop ---
function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.1);
    const elapsed = clock.getElapsedTime();

    // 1. Player Movement
    let moveForward = 0;
    let moveRight = 0;

    if (keys.w || keys.ArrowUp) moveForward += 1;
    if (keys.s || keys.ArrowDown) moveForward -= 1;
    if (keys.d || keys.ArrowRight) moveRight += 1;
    if (keys.a || keys.ArrowLeft) moveRight -= 1;

    if (joystick.active) {
        moveForward -= joystick.dy;
        moveRight += joystick.dx;
    }

    const inputLen = Math.hypot(moveForward, moveRight);
    if (inputLen > 0.05) {
        const normF = moveForward / Math.max(1, inputLen);
        const normR = moveRight / Math.max(1, inputLen);

        const forwardX = -Math.sin(cameraState.yaw);
        const forwardZ = -Math.cos(cameraState.yaw);
        const rightX = Math.cos(cameraState.yaw);
        const rightZ = -Math.sin(cameraState.yaw);

        const vx = (forwardX * normF + rightX * normR) * playerState.speed * dt;
        const vz = (forwardZ * normF + rightZ * normR) * playerState.speed * dt;

        if (!checkCollision(playerState.x + vx, playerState.z)) {
            playerState.x += vx;
        }
        if (!checkCollision(playerState.x, playerState.z + vz)) {
            playerState.z += vz;
        }

        playerGroup.position.set(playerState.x, 0, playerState.z);

        const targetRot = Math.atan2(vx, vz);
        let diff = targetRot - playerState.rotationY;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        playerState.rotationY += diff * 12 * dt;
        playerGroup.rotation.y = playerState.rotationY;

        playerState.walkCycle += dt * 12;
        const swing = Math.sin(playerState.walkCycle) * 0.65;

        if (playerState.isWheelchair) {
            // Wheelchair propulsion arm motion
            leftArm.rotation.x = swing * 0.5;
            rightArm.rotation.x = swing * 0.5;
        } else {
            leftLeg.rotation.x = swing;
            rightLeg.rotation.x = -swing;
            leftArm.rotation.x = -swing * 0.8;
            rightArm.rotation.x = swing * 0.8;
        }
    } else {
        if (!playerState.isWheelchair) {
            leftLeg.rotation.x *= 0.85;
            rightLeg.rotation.x *= 0.85;
        }
        leftArm.rotation.x *= 0.85;
        rightArm.rotation.x *= 0.85;
    }

    // 2. Third-Person Orbit Camera (slightly lower eye-level in wheelchair mode)
    const lookHeight = playerState.isWheelchair ? 1.7 : 2.2;
    const camOffsetX = Math.sin(cameraState.yaw) * Math.cos(cameraState.pitch) * cameraState.distance;
    const camOffsetY = Math.sin(cameraState.pitch) * cameraState.distance;
    const camOffsetZ = Math.cos(cameraState.yaw) * Math.cos(cameraState.pitch) * cameraState.distance;

    camera.position.set(
        playerState.x + camOffsetX,
        Math.max(1.3, camOffsetY),
        playerState.z + camOffsetZ
    );
    camera.lookAt(playerState.x, lookHeight, playerState.z);

    // 3. Proximity Detection
    let foundZone = null;
    for (const zone of interactiveZones) {
        const dist = Math.hypot(playerState.x - zone.x, playerState.z - zone.z);
        if (dist <= zone.radius) {
            foundZone = zone;
            break;
        }
    }

    const promptEl = document.getElementById('proximity-prompt');
    const coordsEl = document.getElementById('coords-display');

    if (foundZone) {
        currentNearbyPlace = foundZone;
        const data = PLACES_DATA[foundZone.id];
        document.getElementById('prompt-icon').textContent = data.icon;
        document.getElementById('prompt-title').textContent = `入去「${data.name}」`;
        promptEl.classList.remove('hidden');
        coordsEl.textContent = `${data.name} 無障礙入口`;
    } else {
        currentNearbyPlace = null;
        promptEl.classList.add('hidden');
        coordsEl.textContent = `社區廣場 (${Math.round(playerState.x)}, ${Math.round(playerState.z)})`;
    }

    // 4. Animate Scene Props
    animatedObjects.forEach(obj => {
        if (obj.type === 'spin') {
            obj.mesh.rotation.y += dt * 1.1;
        } else if (obj.type === 'sway') {
            obj.mesh.rotation.z = Math.sin(elapsed * 2.2 + obj.offset) * 0.12;
        } else if (obj.type === 'fountain') {
            obj.mesh.scale.y = 0.85 + Math.sin(elapsed * 5) * 0.2;
        } else if (obj.type === 'pulseRing') {
            const s = 1 + Math.sin(elapsed * 4) * 0.08;
            obj.mesh.scale.set(s, s, 1);
        } else if (obj.type === 'car') {
            obj.angle += dt * 0.32;
            obj.mesh.position.set(
                Math.cos(obj.angle) * obj.radius,
                0.08,
                Math.sin(obj.angle) * obj.radius
            );
            obj.mesh.rotation.y = -obj.angle;
        }
    });

    renderer.render(scene, camera);
}
</script>
</body>
</html>
