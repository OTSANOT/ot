name: Auto Fetch HK News

on:
  schedule:
    - cron: '0 * * * *' # 每小時自動更新一次
  workflow_dispatch:     # 允許手動點擊執行

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download RTHK News RSS
        run: |
          curl -f -s -A "Mozilla/5.0" "https://rthk.hk" -o news.xml || curl -f -s -A "Mozilla/5.0" "https://news.gov.hk" -o news.xml

      - name: Commit news.xml
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add news.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update HK news" && git push)
