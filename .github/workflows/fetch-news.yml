name: Auto Fetch HK News

on:
  schedule:
    - cron: '0 * * * *' # 每小時自動更新一次
  workflow_dispatch:     # 允許手動點擊執行

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Open HK News RSS
        run: |
          python3 -c "
          import urllib.request

          sources = [
              'https://bbci.co.uk',
              'https://bbci.co.uk',
              'https://info.gov.hk'
          ]

          success = False
          for url in sources:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = resp.read().decode('utf-8', errors='ignore')
                      if '<item>' in data or '<item ' in data:
                          with open('news.xml', 'w', encoding='utf-8') as f:
                              f.write(data)
                          print('SUCCESS from:', url)
                          success = True
                          break
              except Exception as e:
                  print('Error on', url, ':', e)

          if not success:
              raise SystemExit('All RSS feeds failed')
          "

      - name: Commit news.xml
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add news.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update HK news" && git push)
