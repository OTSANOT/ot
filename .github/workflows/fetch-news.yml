name: Auto Fetch HK News

on:
  schedule:
    - cron: '0 * * * *' # 每小時自動更新一次
  workflow_dispatch:     # 允許手動點擊執行

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch HK News via Proxy in GitHub Action
        run: |
          python3 -c "
          import urllib.request, urllib.parse, json

          targets = [
              'https://google.com',
              'https://rthk.hk',
              'https://news.gov.hk'
          ]

          success = False
          for t in targets:
              try:
                  proxy_url = 'https://allorigins.win' + urllib.parse.quote(t, safe='')
                  req = urllib.request.Request(proxy_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      xml_data = resp.read().decode('utf-8', errors='ignore')
                      if '<item>' in xml_data:
                          with open('news.xml', 'w', encoding='utf-8') as f:
                              f.write(xml_data)
                          print('Successfully fetched from:', t)
                          success = True
                          break
              except Exception as e:
                  print('Failed:', t, e)

          if not success:
              raise SystemExit('All sources failed')
          "

      - name: Commit news.xml
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add news.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update HK news" && git push)
