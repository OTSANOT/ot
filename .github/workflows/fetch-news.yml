name: Auto Fetch HK News

on:
  schedule:
    - cron: '0 * * * *' # 每小時自動更新一次
  workflow_dispatch:     # 允許手動點擊執行

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google News HK RSS
        run: |
          curl -f -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          "https://google.com" -o news.xml

      - name: Verify and Commit news.xml
        run: |
          if grep -q "<item>" news.xml; then
            git config --local user.email "github-actions[bot]@://github.com"
            git config --local user.name "github-actions[bot]"
            git add news.xml
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update HK news from Google News" && git push)
          else
            echo "No items found in RSS"
            exit 1
          fi
