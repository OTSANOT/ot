<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4-2-8 Breathing Lantern</title>
<style>
  body{font-family:Arial,sans-serif;background:#121826;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:100vh;margin:0;padding:24px 16px;box-sizing:border-box;text-align:center}
  .domain{font-size:13px;font-weight:bold;color:#34d399;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
  h1{margin:0 0 8px;font-size:28px;color:#38bdf8}
  .sub{color:#94a3b8;font-size:14px}
  .stage{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;margin:16px 0}
  .aura{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.35) 0%,rgba(56,189,248,.08) 60%,transparent 75%);pointer-events:none}
  .lantern{position:relative;width:110px;height:135px;background:linear-gradient(180deg,#f59e0b 0%,#ef4444 55%,#b91c1c 100%);border-radius:50px/60px;box-shadow:0 0 25px rgba(245,158,11,.45),inset 0 0 18px rgba(254,243,199,.5);display:flex;align-items:center;justify-content:center;z-index:2}
  .lantern::before,.lantern::after{content:"";position:absolute;width:54px;height:10px;background:#1e293b;border:2px solid #fbbf24;border-radius:4px}
  .lantern::before{top:-8px}.lantern::after{bottom:-8px}
  .num{font-size:38px;font-weight:bold;color:#fef3c7;text-shadow:0 2px 8px rgba(0,0,0,.4)}
  .phase{font-size:24px;font-weight:bold;color:#fbbf24;margin-bottom:4px}
  .hint{font-size:14px;color:#cbd5e1;min-height:20px}
  .stats{font-size:14px;color:#94a3b8;margin-bottom:14px}
  .btns{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
  button{padding:12px 22px;font-size:15px;font-weight:bold;border-radius:10px;border:none;cursor:pointer}
  .p{background:#38bdf8;color:#0f172a}.s{background:#1e293b;color:#cbd5e1;border:1px solid #334155}
</style>
</head>
<body>
  <div>
    <div class="domain">Sensory &amp; Emotional Regulation</div>
    <h1>4-2-8 Breathing Lantern</h1>
    <div class="sub">4s Inhale &bull; 2s Hold &bull; 8s Exhale</div>
  </div>
  <div class="stage">
    <div class="aura" id="aura"></div>
    <div class="lantern" id="lantern"><div class="num" id="num">4</div></div>
  </div>
  <div>
    <div class="phase" id="phase">Ready</div>
    <div class="hint" id="hint">Press Start when ready</div>
  </div>
  <div>
    <div class="stats">Completed Cycles: <strong id="cyc" style="color:#34d399">0</strong> / 4</div>
    <div class="btns">
      <button class="p" id="startBtn" onclick="toggle()">Start Session</button>
      <button class="s" id="sndBtn" onclick="toggleSnd()">🔔 Bowl: ON</button>
    </div>
  </div>
<script>
const P=[
  {n:"Inhale",d:4,s:1.55,c:"#38bdf8",f:396,h:"Breathe in gently through your nose..."},
  {n:"Hold",d:2,s:1.55,c:"#fbbf24",f:528,h:"Pause softly..."},
  {n:"Exhale",d:8,s:1.0,c:"#34d399",f:264,h:"Breathe out slowly through your mouth..."}
];
let run=0,snd=1,pi=0,sec=4,cyc=0,iv,ctx,bgG,bgO=[];
const L=document.getElementById("lantern"),A=document.getElementById("aura"),N=document.getElementById("num"),
      PH=document.getElementById("phase"),H=document.getElementById("hint"),C=document.getElementById("cyc"),
      SB=document.getElementById("startBtn"),AB=document.getElementById("sndBtn");

function initA(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();}
function startBg(){
  if(!snd)return;initA();stopBg();
  bgG=ctx.createGain();bgG.gain.setValueAtTime(.001,ctx.currentTime);bgG.gain.linearRampToValueAtTime(.06,ctx.currentTime+2);bgG.connect(ctx.destination);
  [174,175.2,261,522].forEach((f,i)=>{
    let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=i===0?.5:i===1?.35:i===2?.25:.12;
    o.connect(g);g.connect(bgG);o.start();bgO.push(o);
  });
}
function stopBg(){
  if(bgG){try{bgG.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5)}catch(e){}bgG=null;}
  setTimeout(()=>{bgO.forEach(o=>{try{o.stop();o.disconnect()}catch(e){}});bgO=[];},600);
}
function chime(f){
  if(!snd)return;initA();
  [1,2,2.75].forEach((m,i)=>{
    let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f*m;
    g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.linearRampToValueAtTime(.1/(i+1),ctx.currentTime+.08);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+2.8);o.connect(g);g.connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+2.8);
  });
}
function toggleSnd(){snd=!snd;AB.textContent=snd?"🔔 Bowl: ON":"🔕 Bowl: OFF";if(run)snd?startBg():stopBg();}
function setP(i){
  let p=P[i];sec=p.d;N.textContent=sec;PH.textContent=p.n;PH.style.color=p.c;H.textContent=p.h;
  L.style.transition=A.style.transition=`transform ${p.d}s ease-in-out`;
  L.style.transform=`scale(${p.s})`;A.style.transform=`scale(${p.s*1.15})`;chime(p.f);
}
function toggle(){
  if(run){
    run=0;clearInterval(iv);stopBg();SB.textContent="Start Session";SB.className="p";
    L.style.transition=A.style.transition="transform .5s";L.style.transform=A.style.transform="scale(1)";
    N.textContent=4;PH.textContent="Ready";PH.style.color="#fbbf24";H.textContent="Press Start when ready";
  }else{
    run=1;SB.textContent="Pause / Reset";SB.className="s";startBg();pi=0;setP(0);
    iv=setInterval(()=>{if(--sec>0)N.textContent=sec;else{if(++pi>=3){pi=0;C.textContent=++cyc;}setP(pi);}},1000);
  }
}
</script>
</body>
</html>
