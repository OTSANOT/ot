<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTR Rush Hour Balance</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    :root { --bg:#121826; --panel:#1e293b; --border:#334155; --blue:#38bdf8; --green:#34d399; --red:#ef4444; --amber:#fbbf24; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:16px; background:var(--bg); color:#fff; font-family:Arial,sans-serif; display:flex; flex-direction:column; align-items:center; text-align:center; }
    .domain { color:var(--green); font-size:12px; font-weight:bold; letter-spacing:.8px; text-transform:uppercase; }
    h1 { margin:4px 0; color:var(--blue); font-size:24px; }
    .sub { max-width:520px; margin-bottom:10px; color:#94a3b8; font-size:13px; }
    .hud { width:min(440px,100%); display:flex; justify-content:space-between; gap:8px; margin-bottom:10px; font-size:15px; font-weight:bold; }
    .cabin { position:relative; width:100%; max-width:440px; height:250px; overflow:hidden; margin-bottom:12px; border:3px solid var(--border); border-radius:14px; background:#0f172a; transition:transform .35s ease; }
    video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    video { opacity:.38; transform:scaleX(-1); }
    canvas { z-index:1; pointer-events:none; }
    .safe-zone { position:absolute; z-index:2; left:36%; bottom:15%; top:25%; width:28%; border:2px dashed var(--green); border-radius:10px; background:rgba(52,211,153,.16); }
    .message { position:absolute; z-index:4; top:10px; left:50%; max-width:92%; transform:translateX(-50%); padding:6px 12px; border-radius:12px; background:rgba(15,23,42,.92); color:var(--amber); font-size:13px; font-weight:bold; white-space:nowrap; }
    .avatar { position:absolute; z-index:3; bottom:20px; left:50%; width:52px; height:88px; margin-left:-26px; display:flex; flex-direction:column; align-items:center; transition:left .08s linear; }
    .head { width:30px; height:30px; border:2px solid #fff; border-radius:50%; background:var(--blue); }
    .torso { width:44px; height:50px; margin-top:3px; display:flex; align-items:center; justify-content:center; border-radius:12px 12px 4px 4px; background:#0284c7; font-size:18px; }
    .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
    button { min-height:44px; padding:12px 18px; border:none; border-radius:10px; cursor:pointer; font-size:14px; font-weight:bold; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    .secondary { border:1px solid var(--border); background:var(--panel); color:#cbd5e1; }
    .primary { background:var(--blue); color:#0f172a; }
    #cameraStatus { min-height:18px; margin:8px 0 0; color:#94a3b8; font-size:12px; }
  </style>
</head>
<body>
  <div class="domain">Trunk &amp; Postural Control</div>
  <h1>🚇 MTR Rush Hour Balance</h1>
  <div class="sub">Counter the train's movement: when it curves right, lean left; when it curves left, lean right. Stay in the green zone!</div>

  <div class="hud">
    <span>Score: <strong id="score" style="color:var(--green)">0</strong></span>
    <span>Stability: <strong id="stability" style="color:var(--blue)">100%</strong></span>
    <span>Time: <strong id="time" style="color:var(--amber)">45s</strong></span>
  </div>

  <div class="cabin" id="cabin">
    <video id="video" playsinline muted></video>
    <canvas id="overlay" width="320" height="240"></canvas>
    <div class="safe-zone" id="zone"></div>
    <div class="message" id="message">Press Start to board train</div>
    <div class="avatar" id="avatar"><div class="head"></div><div class="torso">🧍</div></div>
  </div>

  <div class="controls">
    <button class="secondary" id="leftBtn">◀ Lean Left</button>
    <button class="primary" id="startBtn">Start Session</button>
    <button class="secondary" id="rightBtn">Lean Right ▶</button>
  </div>
  <div id="cameraStatus">Camera optional: you can also use the Lean buttons.</div>

<script>
(() => {
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const ctx = overlay.getContext('2d');
  const avatar = document.getElementById('avatar');
  const zone = document.getElementById('zone');
  const cabin = document.getElementById('cabin');
  const message = document.getElementById('message');
  const scoreEl = document.getElementById('score');
  const stabilityEl = document.getElementById('stability');
  const timeEl = document.getElementById('time');
  const cameraStatus = document.getElementById('cameraStatus');

  let active=false, score=0, stability=100, timeLeft=45;
  let buttonLean=0, cameraLean=0, curveLean=0;
  let loopTimer=null, clockTimer=null, pose=null, camera=null;

  function nudge(amount) {
    if (!active) return;
    buttonLean = Math.max(-42, Math.min(42, buttonLean + amount));
  }

  document.getElementById('leftBtn').addEventListener('click', () => nudge(-7));
  document.getElementById('rightBtn').addEventListener('click', () => nudge(7));

  async function startCamera() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Camera access requires HTTPS or localhost');
      }
      cameraStatus.textContent='Starting camera…';
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false
      });
      video.srcObject=stream;
      await video.play();

      if (typeof Pose === 'undefined') throw new Error('MediaPipe Pose did not load');

      pose = new Pose({locateFile:file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
      pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});
      pose.onResults(results => {
        ctx.clearRect(0,0,overlay.width,overlay.height);
        const lm=results.poseLandmarks;
        if (!lm) { cameraStatus.textContent='Camera active — pose not detected'; return; }

        const leftShoulder=lm[11], rightShoulder=lm[12];
        const leftHip=lm[23], rightHip=lm[24];
        if (!leftShoulder || !rightShoulder || !leftHip || !rightHip) return;
        if ([leftShoulder,rightShoulder,leftHip,rightHip].some(p => (p.visibility ?? 1) < .35)) {
          cameraStatus.textContent='Camera active — move back so shoulders and hips are visible';
          return;
        }

        // Video is mirrored. Convert shoulder-vs-hip displacement into the same
        // left/right direction shown on screen (positive means screen-right).
        const shoulderMid=(leftShoulder.x+rightShoulder.x)/2;
        const hipMid=(leftHip.x+rightHip.x)/2;
        cameraLean=Math.max(-42,Math.min(42,(hipMid-shoulderMid)*220));

        ctx.fillStyle='#38bdf8';
        [leftShoulder,rightShoulder,leftHip,rightHip].forEach(p=>{
          ctx.beginPath(); ctx.arc((1-p.x)*320,p.y*240,5,0,Math.PI*2); ctx.fill();
        });
        cameraStatus.textContent='Camera tracking active — lean your shoulders left or right';
      });

      if (typeof Camera === 'undefined') throw new Error('Camera helper did not load');
      camera=new Camera(video,{onFrame:async()=>{if(pose) await pose.send({image:video});},width:640,height:480});
      await camera.start();
    } catch (err) {
      cameraStatus.textContent='Camera unavailable — use the Lean buttons instead (' + (err.message || 'permission denied') + ')';
    }
  }

  function startGame() {
    if (active) return;
    active=true; score=0; stability=100; timeLeft=45;
    buttonLean=0; cameraLean=0; curveLean=0;
    scoreEl.textContent='0'; stabilityEl.textContent='100%'; timeEl.textContent='45s';
    cabin.style.transform='rotate(0deg)';
    message.textContent='🚇 Departing — Hold Midline!';

    if (!pose) startCamera();

    // A rightward train curve pushes the rider right, so the player must lean left.
    // The opposite applies for a leftward curve.
    const curves=[
      {lean:-24,deg:-3,text:'⚠️ Curve Left — Counter it: lean right →'},
      {lean:24,deg:3,text:'⚠️ Curve Right — Counter it: lean left ←'},
      {lean:-30,deg:-4,text:'⚠️ Sharp Bend Left — Lean right →'},
      {lean:30,deg:4,text:'⚠️ Sharp Bend Right — Lean left ←'}
    ];

    clearInterval(clockTimer); clearInterval(loopTimer);
    clockTimer=setInterval(()=>{
      if (!active) return;
      timeLeft--;
      timeEl.textContent=timeLeft+'s';
      if (timeLeft===43 || timeLeft%3===0) {
        const c=curves[Math.floor(Math.random()*curves.length)];
        curveLean=c.lean;
        message.textContent=c.text;
        cabin.style.transform=`rotate(${c.deg}deg)`;
      }
      if (timeLeft<=0) endGame();
    },1000);

    loopTimer=setInterval(()=>{
      if (!active) return;
      const pos=Math.max(8,Math.min(92,50+buttonLean+cameraLean+curveLean));
      avatar.style.left=pos+'%';
      const inZone=pos>=36 && pos<=64;
      zone.style.borderColor=inZone?'#34d399':'#ef4444';
      if (inZone) {
        score+=2;
        stability=Math.min(100,stability+.08);
        scoreEl.textContent=score;
      } else {
        // Stability can reach zero but will not end the session early; the timer
        // always runs the full 45 seconds unless the player stops it themselves.
        stability=Math.max(0,stability-.12);
      }
      stabilityEl.textContent=Math.round(stability)+'%';
    },80);
  }

  function endGame() {
    active=false;
    clearInterval(loopTimer); clearInterval(clockTimer);
    cabin.style.transform='rotate(0deg)';
    message.textContent='🎉 Ride Complete! Score: '+score;
  }

  document.getElementById('startBtn').addEventListener('click',startGame);
})();
</script>
</body>
</html>
