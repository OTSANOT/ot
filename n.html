<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港即時新聞自動更新</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 750px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.6;
      background-color: #f9f9fb;
      color: #222;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background-color: #004494; }
    .news-card {
      background: white;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .news-card h3 { margin: 0 0 8px 0; font-size: 18px; }
    .news-card a { text-decoration: none; color: #0056b3; }
    .news-card a:hover { text-decoration: underline; }
    .news-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    #status { color: #555; font-style: italic; }
    .error-detail { color: #b00020; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>📰 香港即時新聞</h1>
    <button onclick="loadNews()">🔄 立即更新</button>
  </header>

  <p id="status">正在載入最新香港新聞...</p>
  <div id="news-container"></div>

  <script>
    // 使用 GDELT 全球即時新聞開放 API（原生支援 CORS，專抓香港繁體中文最新報導）
    const GDELT_HK_API = 'https://gdeltproject.org';

    async function loadNews() {
      const statusEl = document.getElementById('status');
      const containerEl = document.getElementById('news-container');
      
      statusEl.textContent = '正在連線抓取香港最新新聞...';
      containerEl.innerHTML = '';

      try {
        const response = await fetch(GDELT_HK_API);
        if (!response.ok) throw new Error(`HTTP 狀態碼 ${response.status}`);
        
        const data = await response.json();
        const articles = data.articles || [];

        if (articles.length === 0) {
          throw new Error('暫無最新新聞回傳');
        }

        statusEl.textContent = `最後更新時間：${new Date().toLocaleTimeString('zh-HK')}（共 ${articles.length} 則香港即時報導）`;

        articles.forEach(art => {
          // 格式化 GDELT 時間戳記 (YYYYMMDDTHHMMSSZ)
          let timeStr = art.seendate || '';
          if (timeStr.length >= 13) {
            timeStr = `${timeStr.slice(0,4)}-${timeStr.slice(4,6)}-${timeStr.slice(6,8)} ${timeStr.slice(9,11)}:${timeStr.slice(11,13)}`;
          }

          const card = document.createElement('div');
          card.className = 'news-card';
          card.innerHTML = `
            <h3><a href="${art.url}" target="_blank" rel="noopener">${art.title}</a></h3>
            <div class="news-meta">來源：${art.domain} ｜ 時間：${timeStr}</div>
          `;
          containerEl.appendChild(card);
        });

      } catch (error) {
        statusEl.innerHTML = `載入新聞失敗。<br><span class="error-detail">錯誤原因：${error.message}</span>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadNews);
    setInterval(loadNews, 900000);
  </script>

</body>
</html>
