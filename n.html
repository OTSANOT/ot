<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港即時新聞自動更新 (穩定版)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 750px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.6;
      background-color: #f9f9fb;
      color: #222;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background-color: #004494; }
    .news-card {
      background: white;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .news-card h3 { margin: 0 0 8px 0; font-size: 18px; }
    .news-card a { text-decoration: none; color: #0056b3; }
    .news-card a:hover { text-decoration: underline; }
    .news-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    .news-desc { font-size: 15px; color: #333; margin: 0; }
    #status { color: #555; font-style: italic; }
    .error-detail { color: #b00020; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>📰 香港即時新聞</h1>
    <button onclick="loadNews()">🔄 立即更新</button>
  </header>

  <p id="status">正在載入最新新聞...</p>
  <div id="news-container"></div>

  <script>
    // 香港電台本地新聞 RSS 網址
    const RTHK_RSS = 'https://rthk.hk';

    // 透過 JSONP (<script>) 繞過瀏覽器 file:/// 與 CORS 限制
    function fetchViaJSONP(targetUrl) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        
        // 設定 10 秒逾時保護
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('連線逾時，請檢查網路環境或防火牆設定'));
        }, 10000);

        function cleanup() {
          clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(data) {
          cleanup();
          if (data && data.contents) {
            resolve(data.contents);
          } else {
            reject(new Error('回傳資料格式異常'));
          }
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('無法連線至代理伺服器（可能被機構防火牆封鎖）'));
        };

        // 使用 AllOrigins 的 JSONP 模式
        script.src = `https://allorigins.win{encodeURIComponent(targetUrl)}&callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    async function loadNews() {
      const statusEl = document.getElementById('status');
      const containerEl = document.getElementById('news-container');
      
      statusEl.innerHTML = '正在讀取香港電台最新新聞...';
      containerEl.innerHTML = '';

      try {
        const xmlText = await fetchViaJSONP(`${RTHK_RSS}?t=${Date.now()}`);

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const items = xmlDoc.querySelectorAll('item');

        if (!items || items.length === 0) {
          throw new Error('找不到新聞內容');
        }

        statusEl.textContent = `最後更新時間：${new Date().toLocaleTimeString('zh-HK')}（顯示最新 8 則）`;

        Array.from(items).slice(0, 8).forEach(item => {
          const title = item.querySelector('title')?.textContent || '無標題';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDate = item.querySelector('pubDate')?.textContent || '';
          const rawDesc = item.querySelector('description')?.textContent || '';
          const cleanDesc = rawDesc.replace(/<[^>]*>?/gm, '').trim();

          const card = document.createElement('div');
          card.className = 'news-card';
          card.innerHTML = `
            <h3><a href="${link}" target="_blank" rel="noopener">${title}</a></h3>
            <div class="news-meta">發佈時間：${pubDate}</div>
            <p class="news-desc">${cleanDesc}</p>
          `;
          containerEl.appendChild(card);
        });

      } catch (error) {
        statusEl.innerHTML = `載入新聞失敗。<br><span class="error-detail">錯誤原因：${error.message}</span>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadNews);
    setInterval(loadNews, 900000);
  </script>

</body>
</html>
