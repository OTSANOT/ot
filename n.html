<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港即時新聞自動更新 (RSS)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 750px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.6;
      background-color: #f9f9fb;
      color: #222;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background-color: #004494; }
    .news-card {
      background: white;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .news-card h3 { margin: 0 0 8px 0; font-size: 18px; }
    .news-card a { text-decoration: none; color: #0056b3; }
    .news-card a:hover { text-decoration: underline; }
    .news-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    .news-desc { font-size: 15px; color: #333; margin: 0; }
    #status { color: #555; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <h1>📰 香港即時新聞</h1>
    <button onclick="loadNews()">🔄 立即更新</button>
  </header>

  <p id="status">正在載入最新新聞...</p>
  <div id="news-container"></div>

  <script>
    // RTHK 本地新聞 RSS 網址 (亦可更換為其他公開 RSS)
    const RTHK_RSS_URL = 'https://rthk.hk';
    
    // 透過 rss2json 轉換為 JSON 格式以解決瀏覽器 CORS 限制
    const API_ENDPOINT = `https://rss2json.com{encodeURIComponent(RTHK_RSS_URL)}`;

    async function loadNews() {
      const statusEl = document.getElementById('status');
      const containerEl = document.getElementById('news-container');
      
      statusEl.textContent = '正在更新最新新聞...';
      containerEl.innerHTML = '';

      try {
        const response = await fetch(API_ENDPOINT);
        const data = await response.json();

        if (data.status !== 'ok') {
          throw new Error('無法讀取 RSS 來源');
        }

        statusEl.textContent = `最後更新時間：${new Date().toLocaleTimeString('zh-HK')}`;

        // 顯示最新 8 則新聞
        data.items.slice(0, 8).forEach(item => {
          const card = document.createElement('div');
          card.className = 'news-card';

          // 清理摘要中的多餘 HTML 標籤
          const cleanDesc = item.description.replace(/<[^>]*>?/gm, '');

          card.innerHTML = `
            <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
            <div class="news-meta">發佈時間：${item.pubDate}</div>
            <p class="news-desc">${cleanDesc}</p>
          `;
          containerEl.appendChild(card);
        });

      } catch (error) {
        statusEl.textContent = '載入新聞失敗，請稍後再試。';
        console.error('RSS Fetch Error:', error);
      }
    }

    // 網頁開啟時自動載入新聞
    window.addEventListener('DOMContentLoaded', loadNews);
    
    // 每 15 分鐘 (900,000 毫秒) 自動在背景重新整理一次
    setInterval(loadNews, 900000);
  </script>

</body>
</html>
