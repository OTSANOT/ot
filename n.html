<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港即時新聞自動更新 (XML 直讀版)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 750px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.6;
      background-color: #f9f9fb;
      color: #222;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background-color: #004494; }
    .news-card {
      background: white;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .news-card h3 { margin: 0 0 8px 0; font-size: 18px; }
    .news-card a { text-decoration: none; color: #0056b3; }
    .news-card a:hover { text-decoration: underline; }
    .news-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    .news-desc { font-size: 15px; color: #333; margin: 0; }
    #status { color: #555; font-style: italic; }
    .error-detail { color: #b00020; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>📰 香港即時新聞</h1>
    <button onclick="loadNews()">🔄 立即更新</button>
  </header>

  <p id="status">正在載入最新新聞...</p>
  <div id="news-container"></div>

  <script>
    // 注意：RTHK 官方 RSS 網址為 rthk9.rthk.hk
    const RTHK_RSS_URL = 'https://rthk.hk';

    // 設定兩個免費 CORS 代理伺服器作自動備援
    const PROXIES = [
      (url) => `https://allorigins.win{encodeURIComponent(url)}`,
      (url) => `https://corsproxy.io{encodeURIComponent(url)}`
    ];

    async function fetchWithFallback(targetUrl) {
      let lastError;
      for (const makeProxyUrl of PROXIES) {
        try {
          const response = await fetch(makeProxyUrl(targetUrl));
          if (!response.ok) throw new Error(`HTTP 錯誤碼: ${response.status}`);
          const text = await response.text();
          if (text.includes('<rss') || text.includes('<item>')) {
            return text;
          }
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('所有代理伺服器均無法連線');
    }

    async function loadNews() {
      const statusEl = document.getElementById('status');
      const containerEl = document.getElementById('news-container');
      
      statusEl.innerHTML = '正在從香港電台讀取最新新聞...';
      containerEl.innerHTML = '';

      try {
        // 加上時間戳記防止瀏覽器讀取舊快取
        const freshUrl = `${RTHK_RSS_URL}?t=${Date.now()}`;
        const xmlText = await fetchWithFallback(freshUrl);

        // 使用瀏覽器內建 DOMParser 直接解析 XML
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const items = xmlDoc.querySelectorAll('item');

        if (!items || items.length === 0) {
          throw new Error('XML 內容中找不到新聞項目');
        }

        statusEl.textContent = `最後更新時間：${new Date().toLocaleTimeString('zh-HK')}（共 ${items.length} 則，顯示最新 8 則）`;

        Array.from(items).slice(0, 8).forEach(item => {
          const title = item.querySelector('title')?.textContent || '無標題';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDate = item.querySelector('pubDate')?.textContent || '';
          const rawDesc = item.querySelector('description')?.textContent || '';
          
          // 清理摘要中的 HTML 標籤與多餘空白
          const cleanDesc = rawDesc.replace(/<[^>]*>?/gm, '').trim();

          const card = document.createElement('div');
          card.className = 'news-card';
          card.innerHTML = `
            <h3><a href="${link}" target="_blank" rel="noopener">${title}</a></h3>
            <div class="news-meta">發佈時間：${pubDate}</div>
            <p class="news-desc">${cleanDesc}</p>
          `;
          containerEl.appendChild(card);
        });

      } catch (error) {
        statusEl.innerHTML = `載入新聞失敗。<br><span class="error-detail">錯誤原因：${error.message}</span>`;
        console.error('RSS Fetch Error:', error);
      }
    }

    window.addEventListener('DOMContentLoaded', loadNews);
    setInterval(loadNews, 900000);
  </script>

</body>
</html>
