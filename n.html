<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港即時新聞與動態自動更新</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 750px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.6;
      background-color: #f9f9fb;
      color: #222;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background-color: #004494; }
    .news-card {
      background: white;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .news-card h3 { margin: 0 0 8px 0; font-size: 18px; }
    .news-card a { text-decoration: none; color: #0056b3; }
    .news-card a:hover { text-decoration: underline; }
    .news-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    .news-desc { font-size: 15px; color: #333; margin: 0; }
    #status { color: #555; font-style: italic; }
    .error-detail { color: #b00020; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>📰 香港最新新聞動態</h1>
    <button onclick="loadNews()">🔄 立即更新</button>
  </header>

  <p id="status">正在載入最新新聞...</p>
  <div id="news-container"></div>

  <script>
    // 維基新聞中文版官方 API（原生支援 origin=* 跨域請求，全球白名單放行）
    const WIKINEWS_API = 'https://wikinews.org*';

    async function loadNews() {
      const statusEl = document.getElementById('status');
      const containerEl = document.getElementById('news-container');
      
      statusEl.textContent = '正在讀取最新香港新聞...';
      containerEl.innerHTML = '';

      try {
        const response = await fetch(WIKINEWS_API);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        const pages = data?.query?.categorymembers || [];

        if (pages.length === 0) {
          throw new Error('暫無新聞資料');
        }

        // 取得這幾則新聞的詳細摘要內容
        const pageIds = pages.map(p => p.pageid).join('|');
        const detailUrl = `https://wikinews.org|info&exintro=1&explaintext=1&inprop=url&pageids=${pageIds}&format=json&origin=*&variant=zh-hk`;
        
        const detailResp = await fetch(detailUrl);
        const detailData = await detailResp.json();
        const pagesDetail = Object.values(detailData?.query?.pages || {});

        // 依照最新時間排序
        pagesDetail.sort((a, b) => b.pageid - a.pageid);

        statusEl.textContent = `最後更新時間：${new Date().toLocaleTimeString('zh-HK')}（已自動轉換為香港繁體）`;

        pagesDetail.forEach(item => {
          const card = document.createElement('div');
          card.className = 'news-card';
          card.innerHTML = `
            <h3><a href="${item.fullurl}" target="_blank" rel="noopener">${item.title}</a></h3>
            <p class="news-desc">${item.extract || '點擊標題閱讀完整報導...'}</p>
          `;
          containerEl.appendChild(card);
        });

      } catch (error) {
        statusEl.innerHTML = `載入新聞失敗。<br><span class="error-detail">錯誤原因：${error.message}</span>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadNews);
    setInterval(loadNews, 900000);
  </script>

</body>
</html>
