<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港即時新聞自動更新</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 750px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.6;
      background-color: #f9f9fb;
      color: #222;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background-color: #004494; }
    .news-card {
      background: white;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .news-card h3 { margin: 0 0 8px 0; font-size: 18px; }
    .news-card a { text-decoration: none; color: #0056b3; }
    .news-card a:hover { text-decoration: underline; }
    .news-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    .news-desc { font-size: 15px; color: #333; margin: 0; }
    #status { color: #555; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <h1>📰 香港即時新聞</h1>
    <button onclick="loadNews()">🔄 重新整理</button>
  </header>

  <p id="status">正在載入最新新聞...</p>
  <div id="news-container"></div>

  <script>
    async function loadNews() {
      const statusEl = document.getElementById('status');
      const containerEl = document.getElementById('news-container');
      
      statusEl.textContent = '正在讀取最新香港新聞...';
      containerEl.innerHTML = '';

      try {
        // 直接讀取同資料夾下的 news.xml，保證 100% 不會出現 CORS 或 Failed to fetch
        const response = await fetch(`./news.xml?t=${Date.now()}`);
        if (!response.ok) {
          throw new Error(`找不到 news.xml (HTTP ${response.status})，請先於 GitHub Actions 執行一次工作流程`);
        }

        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const items = xmlDoc.querySelectorAll('item');

        if (!items || items.length === 0) {
          throw new Error('news.xml 內暫無新聞資料');
        }

        statusEl.textContent = `載入成功（共 ${items.length} 則新聞，顯示最新 8 則）`;

        Array.from(items).slice(0, 8).forEach(item => {
          const title = item.querySelector('title')?.textContent || '無標題';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDate = item.querySelector('pubDate')?.textContent || '';
          const rawDesc = item.querySelector('description')?.textContent || '';
          const cleanDesc = rawDesc.replace(/<[^>]*>?/gm, '').trim();

          const card = document.createElement('div');
          card.className = 'news-card';
          card.innerHTML = `
            <h3><a href="${link}" target="_blank" rel="noopener">${title}</a></h3>
            <div class="news-meta">發佈時間：${pubDate}</div>
            <p class="news-desc">${cleanDesc}</p>
          `;
          containerEl.appendChild(card);
        });

      } catch (error) {
        statusEl.textContent = `載入失敗：${error.message}`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadNews);
  </script>

</body>
</html>
