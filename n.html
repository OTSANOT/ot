<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港即時新聞自動更新</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 750px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.6;
      background-color: #f9f9fb;
      color: #222;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background-color: #004494; }
    .news-card {
      background: white;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .news-card h3 { margin: 0 0 8px 0; font-size: 18px; }
    .news-card a { text-decoration: none; color: #0056b3; }
    .news-card a:hover { text-decoration: underline; }
    .news-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    .news-desc { font-size: 15px; color: #333; margin: 0; }
    #status { color: #555; font-style: italic; }
    .error-detail { color: #b00020; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>📰 香港即時新聞</h1>
    <button onclick="loadNews()">🔄 立即更新</button>
  </header>

  <p id="status">正在載入最新新聞...</p>
  <div id="news-container"></div>

  <script>
    // 使用正確的 rthk9 官方 RSS 網址
    const RTHK_RSS = 'https://rthk.hk';
    
    // 備援新聞來源（香港政府新聞網）
    const GOV_RSS = 'https://news.gov.hk';

    async function fetchRssAsJson(rssUrl) {
      const apiUrl = `https://rss2json.com{encodeURIComponent(rssUrl)}`;
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      if (data.status !== 'ok' || !data.items || data.items.length === 0) {
        throw new Error(data.message || '無法解析新聞資料');
      }
      return data.items;
    }

    async function loadNews() {
      const statusEl = document.getElementById('status');
      const containerEl = document.getElementById('news-container');
      
      statusEl.innerHTML = '正在讀取最新香港新聞...';
      containerEl.innerHTML = '';

      let items = [];
      let sourceName = '香港電台 (RTHK)';

      try {
        // 先嘗試讀取 RTHK
        items = await fetchRssAsJson(RTHK_RSS);
      } catch (rthkErr) {
        try {
          // 若 RTHK 暫時無回應，自動切換至香港政府新聞網
          sourceName = '香港政府新聞網 (GovHK)';
          items = await fetchRssAsJson(GOV_RSS);
        } catch (govErr) {
          statusEl.innerHTML = `載入新聞失敗。<br><span class="error-detail">RTHK 錯誤：${rthkErr.message} ｜ GovHK 錯誤：${govErr.message}</span>`;
          return;
        }
      }

      statusEl.textContent = `來源：${sourceName} ｜ 最後更新：${new Date().toLocaleTimeString('zh-HK')}`;

      items.slice(0, 8).forEach(item => {
        const cleanDesc = (item.description || '').replace(/<[^>]*>?/gm, '').trim();
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
          <div class="news-meta">發佈時間：${item.pubDate}</div>
          <p class="news-desc">${cleanDesc}</p>
        `;
        containerEl.appendChild(card);
      });
    }

    window.addEventListener('DOMContentLoaded', loadNews);
    setInterval(loadNews, 900000);
  </script>

</body>
</html>
