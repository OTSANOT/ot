            correctIndex: 0,
            answerText: "這有助推動區內可持續基建融資合作，並進一步鞏固香港國際金融中心優勢。"
          },
          {
            type: "WHICH（哪一個）",
            badgeClass: "badge-which",
            question: "協議中提到要在香港設立辦事處的是哪一個國際機構？",
            options: ["亞洲基礎設施投資銀行（亞投行）", "世界衞生組織", "國際奧委會"],
            correctIndex: 0,
            answerText: "涉及的國際機構是亞洲基礎設施投資銀行（亞投行，AIIB）。"
          },
          {
            type: "WHY（為何）",
            badgeClass: "badge-why",
            question: "亞投行選擇在香港設立辦事處，反映了香港具備甚麼優勢？",
            options: ["匯聚國際資本、連接海內外市場及國際金融中心地位優勢", "擁有最大面積的農田", "全年只有攝氏五度"],
            correctIndex: 0,
            answerText: "香港具備匯聚國際資本、連接內地與環球市場以及國際金融中心的優勢。"
          }
        ]
      }
    ];

    let currentArticleIndex = 0;
    let userAnswers = {};
    let isSpeaking = false;

    function getBadgeClassByIndex(idx) {
      const classes = ["badge-who", "badge-when", "badge-what", "badge-how", "badge-which", "badge-why"];
      return classes[idx] || "badge-who";
    }

    function getTodayFormattedStrings() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      const weekday = weekdays[now.getDay()];
      return {
        zhDate: `${year}年${month}月${day}日（${weekday}）`,
        isoDate: `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`
      };
    }

    function toggleSettings() {
      const panel = document.getElementById('settings-panel');
      panel.classList.toggle('hidden');
      const savedKey = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('api-key-input').value = savedKey;
    }

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('gemini_api_key', key);
      document.getElementById('settings-panel').classList.add('hidden');
      fetchDailyHongKongNews(true);
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('article-tabs');
      tabsContainer.innerHTML = '';
      newsArticles.forEach((article, idx) => {
        const isActive = idx === currentArticleIndex;
        const btn = document.createElement('button');
        btn.className = isActive ? 'tab-btn active' : 'tab-btn';
        btn.innerText = article.tabLabel;
        btn.onclick = () => {
          stopSpeech();
          currentArticleIndex = idx;
          renderTabs();
          renderArticle();
        };
        tabsContainer.appendChild(btn);
      });
    }

    function renderArticle() {
      const article = newsArticles[currentArticleIndex];
      if (!article) return;

      document.getElementById('article-category').innerText = article.category;
      document.getElementById('article-source').innerText = article.source;
      document.getElementById('article-title').innerText = article.title;
      document.getElementById('article-subtitle').innerText = article.subtitle;

      const paraContainer = document.getElementById('article-paragraphs');
      paraContainer.innerHTML = article.paragraphs
        .map(p => `<p>${p}</p>`)
        .join('');

      renderQuestions();
    }

    function renderQuestions() {
      const article = newsArticles[currentArticleIndex];
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      if (!userAnswers[article.id]) {
        userAnswers[article.id] = {};
      }
      const answersForArticle = userAnswers[article.id];

      let score = 0;
      article.questions.forEach((q, qIdx) => {
        if (answersForArticle[qIdx] === q.correctIndex) {
          score++;
        }
      });
      document.getElementById('score-badge').innerText = `得分：${score} / ${article.questions.length}`;

      article.questions.forEach((q, qIdx) => {
        const selectedIdx = answersForArticle[qIdx];
        const isAnswered = selectedIdx !== undefined;
        const badgeClass = q.badgeClass || getBadgeClassByIndex(qIdx);

        const card = document.createElement('div');
        card.className = 'q-card';

        let optionsHtml = q.options.map((opt, optIdx) => {
          let btnClass = 'opt-btn';
          let statusIcon = '';

          if (isAnswered) {
            if (optIdx === q.correctIndex) {
              btnClass += ' correct';
              statusIcon = '<span>✅</span>';
            } else if (optIdx === selectedIdx) {
              btnClass += ' wrong';
              statusIcon = '<span>❌</span>';
            } else {
              btnClass += ' dimmed';
            }
          }

          return `
            <button onclick="selectOption(${qIdx}, ${optIdx})" class="${btnClass}" ${isAnswered ? 'disabled' : ''}>
              <span>${opt}</span>
              ${statusIcon}
            </button>
          `;
        }).join('');

        const explanationHtml = isAnswered
          ? `<div class="explanation-box">
               <strong>💡 解析：</strong>${q.answerText}
             </div>`
          : '';

        card.innerHTML = `
          <div>
            <span class="q-badge ${badgeClass}">${q.type}</span>
          </div>
          <p class="q-text">${qIdx + 1}. ${q.question}</p>
          <div class="options-list">${optionsHtml}</div>
          ${explanationHtml}
        `;
        container.appendChild(card);
      });
    }

    function selectOption(qIdx, optIdx) {
      const article = newsArticles[currentArticleIndex];
      userAnswers[article.id][qIdx] = optIdx;
      renderQuestions();
    }

    function toggleSpeech() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      if (!('speechSynthesis' in window)) {
        alert('您的瀏覽器不支援語音朗讀功能。');
        return;
      }

      const article = newsArticles[currentArticleIndex];
      const fullText = `${article.title}。${article.subtitle}。${article.paragraphs.join(' ')}`;
      const utterance = new SpeechSynthesisUtterance(fullText);
      utterance.lang = 'zh-HK';
      utterance.rate = 0.9;

      utterance.onend = () => stopSpeech();
      utterance.onerror = () => stopSpeech();

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
      isSpeaking = true;
      document.getElementById('speak-icon').innerText = '⏹️';
      document.getElementById('speak-label').innerText = '停止朗讀';
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      document.getElementById('speak-icon').innerText = '🔊';
      document.getElementById('speak-label').innerText = '朗讀新聞';
    }

    async function fetchDailyHongKongNews(isManualClick = false) {
      const dateInfo = getTodayFormattedStrings();
      const btn = document.getElementById('btn-refresh-news');
      const icon = document.getElementById('refresh-icon');
      const label = document.getElementById('refresh-label');
      const banner = document.getElementById('live-update-banner');

      btn.disabled = true;
      icon.innerText = '⏳';
      label.innerText = '正在搜尋今日香港新聞...';

      banner.className = 'banner banner-info';
      banner.innerText = `🌐 正在搜尋 ${dateInfo.zhDate} 香港最新新聞並自動編寫 5W1H 問題...`;
      banner.classList.remove('hidden');

      const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();

      if (!apiKey) {
        banner.className = 'banner banner-success';
        banner.innerText = `✅ 已載入離線新聞範例及 5W1H 問答（點擊右上角「⚙️ API 設定」輸入金鑰即可搜尋即時新聞）。`;
        btn.disabled = false;
        icon.innerText = '🔄';
        label.innerText = '更新今日最新新聞';
        return;
      }

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      const systemPrompt = `You are a Hong Kong occupational therapy cognitive rehabilitation content editor.
Search for 2 real, current Hong Kong news stories from today (${dateInfo.zhDate}) using Google Search.
Return ONLY a valid JSON array (no markdown fences) matching this exact schema:
[
  {
    "id": "unique-slug",
    "tabLabel": "📰 簡短分頁標題",
    "category": "本港要聞",
    "source": "新聞來源（${dateInfo.zhDate}）",
    "title": "新聞標題",
    "subtitle": "一句重點摘要",
    "paragraphs": ["第一段（約40-60字）", "第二段", "第三段", "第四段"],
    "questions": [
      {
        "type": "WHO（何人）",
        "question": "問題",
        "options": ["選項A", "選項B", "選項C"],
        "correctIndex": 0,
        "answerText": "簡明解析"
      }
    ]
  }
]
Each article MUST have 6 questions in order: WHO（何人）, WHEN（何時）, WHAT（何事）, HOW（如何）, WHICH（哪一個）, WHY（為何）. Use Traditional Chinese (Hong Kong).`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `搜尋今日（${dateInfo.zhDate}）兩則香港重要新聞並製作 5W1H 認知訓練題目。` }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            tools: [{ googleSearch: {} }]
          })
        });

        if (!response.ok) {
          throw new Error(`API 錯誤 (${response.status})`);
        }

        const data = await response.json();
        let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
        const parsedArticles = JSON.parse(rawText);

        if (Array.isArray(parsedArticles) && parsedArticles.length > 0) {
          newsArticles = parsedArticles;
          currentArticleIndex = 0;
          userAnswers = {};
          renderTabs();
          renderArticle();

          banner.className = 'banner banner-success';
          banner.innerText = `✅ 已成功更新 ${dateInfo.zhDate} 香港最新新聞及 5W1H 問答！`;
        } else {
          throw new Error('回傳格式不正確');
        }
      } catch (err) {
        banner.className = 'banner banner-error';
        banner.innerText = `⚠️ 更新失敗（${err.message}），目前顯示離線新聞範例。請檢查 API Key 是否正確。`;
      } finally {
        btn.disabled = false;
        icon.innerText = '🔄';
        label.innerText = '更新今日最新新聞';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('today-date-display').innerText = getTodayFormattedStrings().zhDate;
      renderTabs();
      renderArticle();
      fetchDailyHongKongNews(false);
    });
  </script>
</body>
</html>
