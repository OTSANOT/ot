<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>歡樂掟彩虹 - Rainbow of Happiness</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
body{margin:0;font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;background:radial-gradient(circle at 50% 15%,#4c1684,#16072a 72%,#090112);color:#fff;user-select:none;touch-action:manipulation;min-height:100vh}
.app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px;gap:8px}.header,.footer{width:min(960px,100%)}
.header{background:linear-gradient(#dc2626,#991b1b);border:3px solid #facc15;border-radius:18px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px #0008}.title{font-size:20px;font-weight:900;color:#fde047}.sub{font-size:11px;color:#fef3c7}.hud{display:flex;gap:8px}.hudbox{background:#0006;border:1px solid #facc1580;border-radius:10px;padding:5px 10px;text-align:center}.hudbox small{display:block;font-size:9px}.hudbox b{font-size:22px;color:#fde047}
.prizes{width:min(960px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.prize{border-radius:12px;padding:7px 4px;text-align:center;font-weight:900;font-size:12px}.red{background:#dc2626}.green{background:#16a34a}.yellow{background:#facc15;color:#111}.purple{background:#9333ea}
.game{width:min(960px,100%);height:min(64vh,620px);min-height:420px;background:#ef4444;border:4px solid #ef4444;border-radius:18px;padding:8px;position:relative;box-shadow:0 24px 45px #0009}canvas{width:100%;height:100%;display:block;border-radius:10px;background:#fff;cursor:crosshair}
.banner{position:absolute;top:16px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:999px;background:#111d;font-weight:900;opacity:0;transition:.18s;white-space:nowrap;z-index:3}.banner.show{opacity:1}
.footer{background:#0f1729dd;border:1px solid #334155;border-radius:16px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center}.footer button{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.coinbtn{background:linear-gradient(#fde68a,#eab308,#a16207);color:#713f12}.mutebtn{background:#1e293b;color:#fff}
@media(max-width:640px){.game{height:55vh;min-height:360px}.title{font-size:14px}.header{padding:7px}.hudbox{padding:3px 6px}.hudbox b{font-size:16px}.prize{font-size:9px}.footer button{padding:9px 8px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div><div class="title">RAINBOW OF HAPPINESS</div><div class="sub">TOUCHING THE BLACK LINE LOSES</div></div><div class="hud"><div class="hudbox"><small>代幣 TOKEN</small><b id="coins">20</b></div><div class="hudbox"><small>獎券 TICKETS</small><b id="tickets">0</b></div></div></header>
<section class="prizes"><div class="prize red">SMALL 紅<br>🦐 蝦條 +10</div><div class="prize green">MEDIUM 綠<br>🎁 盲盒 +30</div><div class="prize yellow">LARGE 黃<br>🏎️ 合金車 +80</div><div class="prize purple">CHOICE 紫<br>🧸 公仔 +200</div></section>
<main class="game"><canvas id="canvas"></canvas><div id="banner" class="banner"></div></main>
<footer class="footer"><button id="mute" class="mutebtn">🔊 音效開</button><button id="add" class="coinbtn">🪙 免費入幣 (+10)</button></footer>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),hit=document.createElement('canvas'),hctx=hit.getContext('2d',{willReadFrequently:true});
let coins=20,tickets=0,sound=true,flying=null,aim=null,landed=[],particles=[];
let metal,win,buzz,audioReady=false;
function setupAudio(){if(audioReady||typeof Tone==='undefined')return;try{Tone.start();metal=new Tone.MetalSynth({frequency:480,envelope:{attack:.001,decay:.12,release:.04},resonance:4200}).toDestination();win=new Tone.PolySynth(Tone.Synth).toDestination();buzz=new Tone.Synth({oscillator:{type:'sawtooth'},envelope:{attack:.01,decay:.28,sustain:0,release:.1}}).toDestination();audioReady=true}catch(e){}}
function tone(type){if(!sound)return;setupAudio();if(!audioReady)return;const now=Tone.now();if(type==='toss')metal.triggerAttackRelease('D6','32n',now);else if(type==='clink')metal.triggerAttackRelease('A6','64n',now);else if(type==='win')win.triggerAttackRelease(['C5','E5','G5','C6'],'8n',now);else if(type==='lose')buzz.triggerAttackRelease(['G2','D2'],'8n',now)}
function speakLose(){if(!sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('擲界');u.lang='zh-HK';u.rate=.82;u.pitch=.9;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
const C={red:'#ef4444',green:'#22c55e',yellow:'#eab308',purple:'#9333ea',blue:'#3b82f6',black:'#111111',white:'#f8fafc'};
function ring(target,x,y,R,isHit,coreBlue=false){target.save();[R, R*.76,R*.52,R*.28].forEach((r,i)=>{target.beginPath();target.arc(x,y,r,0,Math.PI*2);target.fillStyle=i===0?C.red:i===1?C.green:i===2?C.yellow:(coreBlue?C.blue:C.purple);target.fill();target.lineWidth=isHit?Math.max(3,R*.028):Math.max(3,R*.024);target.strokeStyle=C.black;target.stroke()});target.restore()}
function drawBoard(target,w,h,isHit){target.fillStyle=C.white;target.fillRect(0,0,w,h);const m=Math.min(w,h),lw=Math.max(3,m*.012),edge=Math.min(w,h)*.155;
// Much larger rainbow edge cells
for(let i=0;i<6;i++){let x=w*i/6+w/12;ring(target,x,-edge*.18,edge,isHit);ring(target,x,h+edge*.18,edge,isHit)}
for(let j=0;j<4;j++){let y=h*j/4+h/8;ring(target,-edge*.18,y,edge,isHit);ring(target,w+edge*.18,y,edge,isHit)}
// Large central five-ring rainbow field
const cx=w*.5,cy=h*.5,R=m*.27;
function sliced(x,y,r,angle){target.save();ring(target,x,y,r,isHit,false);target.translate(x,y);target.rotate(angle);target.fillStyle=C.white;target.fillRect(-r,-r*.075,r*2,r*.15);target.strokeStyle=C.black;target.lineWidth=lw;target.beginPath();target.moveTo(-r,-r*.075);target.lineTo(r,-r*.075);target.moveTo(-r,r*.075);target.lineTo(r,r*.075);target.stroke();target.restore()}
sliced(cx,cy,R,-.28);sliced(cx-R*.72,cy-R*.58,R*.82,.32);sliced(cx+R*.72,cy-R*.58,R*.82,-.32);sliced(cx-R*.72,cy+R*.58,R*.82,-.32);sliced(cx+R*.72,cy+R*.58,R*.82,.32);
// Inner diagonal blue-purple patch detail
ring(target,cx-R*.72,cy-R*.58,R*.25,isHit,false);ring(target,cx+R*.72,cy+R*.58,R*.25,isHit,true)
if(!isHit){target.fillStyle='#00000012';target.fillRect(w*.12,h*.12,w*.76,h*.76)}}
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;hit.width=Math.round(r.width);hit.height=Math.round(r.height);drawBoard(ctx,r.width,r.height,false);drawBoard(hctx,r.width,r.height,true)}
addEventListener('resize',resize);
function drawCoin(x,y,r){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.arc(2,3,r,0,Math.PI*2);ctx.fillStyle='#0007';ctx.fill();const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,'#fff7c2');g.addColorStop(.55,'#eab308');g.addColorStop(1,'#854d0e');ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#713f12';ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.72,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#713f12';ctx.fillRect(-r*.42,-r*.16,r*.84,r*.32);ctx.fillStyle='#fef08a';ctx.font=`900 ${Math.max(7,r*.32)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('TOKEN',0,1);ctx.restore()}
function judge(x,y,r){const w=hit.width,h=hit.height;if(x-r<2||x+r>w-2||y-r<2||y+r>h-2)return {win:false,tickets:0,title:'飛出界外！擲界 ❌'};const sx=Math.floor(x-r),sy=Math.floor(y-r),size=Math.ceil(r*2),p=hctx.getImageData(sx,sy,size,size).data;let band=null;for(let py=0;py<size;py++)for(let px=0;px<size;px++){const dx=sx+px-x,dy=sy+py-y;if(dx*dx+dy*dy<=((r-.7)*(r-.7)){const i=(py*size+px)*4,R=p[i],G=p[i+1],B=p[i+2];if(R<80&&G<80&&B<80)return {win:false,tickets:0,title:'壓中黑線！擲界 ❌'};if(R>235&&G>235&&B>235)return {win:false,tickets:0,title:'落在白底！擲界 ❌'};let b=null;if(R>190&&G<120&&B<120)b='red';else if(G>130&&R<120)b='green';else if(R>190&&G>150&&B<100)b='yellow';else if(R>100&&B>150)b='purple';else if(B>150&&R<130)b='blue';if(b){if(band&&band!==b)return {win:false,tickets:0,title:'跨色壓界！擲界 ❌'};band=b}}}if(band==='purple'||band==='blue')return {win:true,tickets:200,title:'👑 紫色大獎 CHOICE！+200 獎券'};if(band==='yellow')return {win:true,tickets:80,title:'🏎️ 黃色大獎 LARGE！+80 獎券'};if(band==='green')return {win:true,tickets:30,title:'🎁 綠色中獎 MEDIUM！+30 獎券'};if(band==='red')return {win:true,tickets:10,title:'🦐 紅色中獎 SMALL！+10 獎券'};return {win:false,tickets:0,title:'擲界無獎 ❌'}}
function announce(title,winResult){const b=document.getElementById('banner');b.textContent=title;b.style.background=winResult?'#16a34aee':'#991b1bee';b.classList.add('show');clearTimeout(b.hideTimer);b.hideTimer=setTimeout(()=>b.classList.remove('show'),2600)}
function updateHUD(){document.getElementById('coins').textContent=coins;document.getElementById('tickets').textContent=tickets}
function toss(x,y){if(flying)return;if(coins<=0){announce('代幣用完！請免費入幣',false);return}coins--;updateHUD();tone('toss');const w=hit.width,h=hit.height,flying={x:w/2,y:h+20,tx:Math.max(20,Math.min(w-20,x)),ty:Math.max(20,Math.min(h-20,y)),t:0};window.flying=flying;flying.current=flying}
function pointerPos(e){const r=canvas.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{setupAudio();aim=pointerPos(e)});canvas.addEventListener('pointermove',e=>{if(aim)aim=pointerPos(e)});canvas.addEventListener('pointerup',e=>{if(!aim)return;const p=pointerPos(e);aim=null;toss(p.x,p.y)});
canvas.addEventListener('pointerleave',()=>aim=null);
document.getElementById('add').onclick=()=>{setupAudio();coins+=10;updateHUD();tone('win')};document.getElementById('mute').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊 音效開':'🔇 音效關'};
function render(){const r=canvas.getBoundingClientRect(),w=hit.width,h=hit.height,dpr=Math.min(devicePixelRatio||1,2);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(hit,0,0,w,h,0,0,w,h);landed.forEach(c=>{ctx.save();ctx.globalAlpha=c.alpha==null?1:c.alpha;drawCoin(c.x,c.y,Math.max(10,Math.min(w,h)*.032));ctx.restore()});if(aim){ctx.beginPath();ctx.arc(aim.x,aim.y,Math.max(10,Math.min(w,h)*.032),0,Math.PI*2);ctx.fillStyle='#fef08a55';ctx.fill();ctx.setLineDash([5,4]);ctx.strokeStyle='#111';ctx.stroke();ctx.setLineDash([])}if(window.flying){const f=window.flying,flyingObj=f;f.t++;const ease=1-Math.pow(1-Math.min(1,f.t/30),2);f.x=flyingObj.x+(flyingObj.tx-flyingObj.x)*ease;f.y=flyingObj.y+(flyingObj.ty-flyingObj.y)*ease;if(f.t===30)tone('clink');if(f.t>=55){const res=judge(flyingObj.tx,flyingObj.ty,Math.max(10,Math.min(w,h)*.032));landed.push({x:flyingObj.tx,y:flyingObj.ty,alpha:1});if(res.win){tickets+=res.tickets;updateHUD();tone(res.tickets>=80?'win':'win')}else{tone('lose');speakLose()}announce(res.title,res.win);window.flying=null;flying=null}}particles=[];requestAnimationFrame(render)}
window.onload=()=>{resize();updateHUD();render()};
</script>
</body>
</html>
