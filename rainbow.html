<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歡樂掟彩虹 - Rainbow of Happiness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at 50% 20%, #3b0764 0%, #17032b 65%, #090112 100%);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* 街機紅黃經典邊框 */
        .arcade-header {
            background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
            border: 3px solid #facc15;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.35);
        }

        /* 模擬真實遊戲檯紅框與反光膠墊質感 */
        .arcade-table-frame {
            background: linear-gradient(145deg, #b91c1c, #7f1d1d);
            border: 4px solid #ef4444;
            border-radius: 18px;
            padding: 10px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.85),
                inset 0 0 18px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        /* 膠墊高光反光層 */
        .gloss-overlay {
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0.22) 0%,
                rgba(255, 255, 255, 0.05) 35%,
                rgba(255, 255, 255, 0) 50%,
                rgba(255, 255, 255, 0.12) 85%,
                rgba(255, 255, 255, 0) 100%
            );
            pointer-events: none;
            border-radius: 10px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            cursor: crosshair;
            background: #f8fafc;
        }

        /* 實體代幣按鈕 */
        .token-btn {
            background: radial-gradient(circle at 35% 30%, #fef08a 0%, #eab308 55%, #a16207 100%);
            box-shadow: 0 5px 0 #713f12, 0 8px 16px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }
        .token-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #713f12, 0 3px 8px rgba(0,0,0,0.5);
        }

        @keyframes popScale {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popScale 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between text-white py-2.5 px-2 sm:px-4">

    <script>
        /**
         * 歡樂掟彩虹 (Rainbow of Happiness) 寫實重寫版
         * 1. 還原照片中的拼接波浪地墊結構：外圈連續波浪半圓、中層交錯S型弧線、中央斜切雙圓心及小半圓陣列。
         * 2. 離屏雙緩衝高精準像素判定：任何一像素觸及黑線或白底即判「擲界」。
         * 3. 落地後提供放大鏡特寫檢視（Zoom Lens），讓玩家清楚看到金幣是否壓到黑線！
         */
        const canvas = document.getElementById('rainbowCanvas');
        const ctx = canvas.getContext('2d');

        // 離屏底圖畫布 (靜態地墊緩存，大幅提升流暢度)
        const boardCacheCanvas = document.createElement('canvas');
        const boardCacheCtx = boardCacheCanvas.getContext('2d');

        // 離屏判定畫布 (純色無抗鋸齒干擾，供精確碰撞運算)
        const hitCanvas = document.createElement('canvas');
        const hitCtx = hitCanvas.getContext('2d', { willReadFrequently: true });

        const gameState = {
            coins: 20,
            tickets: 0,
            soundOn: true,
            showZoomLens: true,
            isAiming: false,
            aimX: 0,
            aimY: 0,
            landedCoins: [],
            flyingCoin: null,
            lastLandingSpot: null, // 記錄最後一枚落點供放大鏡顯示
            zoomTimer: 0,
            particles: [],
            coinRadius: 13
        };

        // 配色定義
        const PALETTE = {
            RED: '#EF4444',
            GREEN: '#22C55E',
            YELLOW: '#EAB308',
            PURPLE: '#9333EA',
            BLUE_CENTER: '#3B82F6',
            BLACK: '#000000',
            WHITE: '#F8FAFC'
        };

        // Tone.js 音效初始化
        let audioReady = false;
        let metalSynth, winPoly, buzzSynth;

        function setupAudio() {
            if (audioReady) return;
            try {
                Tone.start();
                metalSynth = new Tone.MetalSynth({
                    frequency: 480,
                    envelope: { attack: 0.001, decay: 0.1, release: 0.04 },
                    harmonicity: 5.1,
                    modulationIndex: 18,
                    resonance: 4200,
                    octaves: 1.5
                }).toDestination();
                metalSynth.volume.value = -10;

                winPoly = new Tone.PolySynth(Tone.Synth).toDestination();
                winPoly.volume.value = -6;

                buzzSynth = new Tone.Synth({
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.01, decay: 0.22, sustain: 0, release: 0.08 }
                }).toDestination();
                buzzSynth.volume.value = -10;
                audioReady = true;
            } catch (err) {
                console.warn('音效略過', err);
            }
        }

        function triggerSound(type) {
            if (!gameState.soundOn) return;
            setupAudio();
            if (!audioReady) return;

            const now = Tone.now();
            if (type === 'toss') {
                metalSynth.triggerAttackRelease('D6', '32n', now);
            } else if (type === 'clink') {
                metalSynth.triggerAttackRelease('A6', '64n', now);
            } else if (type === 'win') {
                winPoly.triggerAttackRelease(['C5', 'E5', 'G5', 'C6'], '16n', now);
            } else if (type === 'jackpot') {
                winPoly.triggerAttackRelease(['C5', 'E5', 'G5', 'B5', 'D6', 'G6'], '8n', now);
            } else if (type === 'lose') {
                buzzSynth.triggerAttackRelease('G2', '8n', now);
            }
        }

        /**
         * 繪製沿著圓弧彎曲的英文標籤 (SMALL / MEDIUM / LARGE)
         */
        function drawCurvedText(targetCtx, text, cx, cy, radius, midAngle, fontSize) {
            targetCtx.save();
            targetCtx.font = `900 ${fontSize}px sans-serif`;
            targetCtx.fillStyle = '#111111';
            targetCtx.textAlign = 'center';
            targetCtx.textBaseline = 'middle';

            const totalAngle = (text.length * fontSize * 0.68) / radius;
            let currentAngle = midAngle - totalAngle / 2;

            // 若文字在下半圓，反轉方向使字體正向易讀
            const isBottom = Math.sin(midAngle) > 0.25;
            if (isBottom) {
                currentAngle = midAngle + totalAngle / 2;
            }

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const charAngle = (fontSize * 0.68) / radius;
                const theta = isBottom ? currentAngle - charAngle / 2 : currentAngle + charAngle / 2;

                targetCtx.save();
                targetCtx.translate(cx + Math.cos(theta) * radius, cy + Math.sin(theta) * radius);
                targetCtx.rotate(isBottom ? theta - Math.PI / 2 : theta + Math.PI / 2);
                targetCtx.fillText(char, 0, 0);
                targetCtx.restore();

                currentAngle += isBottom ? -charAngle : charAngle;
            }
            targetCtx.restore();
        }

        /**
         * 繪製單組彩虹扇形 / 半圓 / 全圓
         * @param {boolean} isHitMap 是否繪製於判定畫布 (判定畫布不畫細小文字避免誤判黑線)
         */
        function drawRainbowUnit(targetCtx, cx, cy, outerR, startAngle, endAngle, lineW, isHitMap, options = {}) {
            const {
                includePurple = true,
                centerBlue = false,
                labelAngle = (startAngle + endAngle) / 2
            } = options;

            const rings = includePurple
                ? [
                    { r: outerR * 1.00, color: PALETTE.RED, label: 'SMALL', textR: outerR * 0.88 },
                    { r: outerR * 0.74, color: PALETTE.GREEN, label: 'MEDIUM', textR: outerR * 0.62 },
                    { r: outerR * 0.49, color: PALETTE.YELLOW, label: 'LARGE', textR: outerR * 0.37 },
                    { r: outerR * 0.25, color: centerBlue ? PALETTE.BLUE_CENTER : PALETTE.PURPLE, label: '', textR: 0 }
                  ]
                : [
                    { r: outerR * 1.00, color: PALETTE.RED, label: 'SMALL', textR: outerR * 0.86 },
                    { r: outerR * 0.70, color: PALETTE.GREEN, label: 'MEDIUM', textR: outerR * 0.56 },
                    { r: outerR * 0.40, color: PALETTE.YELLOW, label: 'LARGE', textR: outerR * 0.26 }
                  ];

            const isFullCircle = Math.abs(endAngle - startAngle) >= Math.PI * 1.99;

            rings.forEach(ring => {
                targetCtx.beginPath();
                if (isFullCircle) {
                    targetCtx.arc(cx, cy, ring.r, 0, Math.PI * 2);
                } else {
                    targetCtx.arc(cx, cy, ring.r, startAngle, endAngle);
                    targetCtx.closePath();
                }
                targetCtx.fillStyle = ring.color;
                targetCtx.fill();

                targetCtx.lineWidth = lineW;
                targetCtx.strokeStyle = PALETTE.BLACK;
                targetCtx.stroke();

                // 僅在可見畫布上繪製弧形英文標籤
                if (!isHitMap && ring.label && outerR > 42) {
                    const fontSize = Math.max(6, Math.round(outerR * 0.085));
                    drawCurvedText(targetCtx, ring.label, cx, cy, ring.textR, labelAngle, fontSize);
                }
            });
        }

        /**
         * 繪製斜切全圓 (還原照片中央四個帶白色斜通道的彩虹圓)
         */
        function drawSlicedRainbowCircle(targetCtx, cx, cy, outerR, slashAngle, lineW, isHitMap, centerBlue = false) {
            // 先畫完整彩虹圓
            drawRainbowUnit(targetCtx, cx, cy, outerR, 0, Math.PI * 2, lineW, isHitMap, {
                includePurple: true,
                centerBlue,
                labelAngle: slashAngle + Math.PI / 2
            });

            // 繪製貫穿圓心的白色斜切帶 + 兩側黑線邊界
            const bandHalfW = outerR * 0.11;
            targetCtx.save();
            targetCtx.translate(cx, cy);
            targetCtx.rotate(slashAngle);

            targetCtx.fillStyle = isHitMap ? '#FFFFFF' : PALETTE.WHITE;
            targetCtx.fillRect(-outerR - lineW, -bandHalfW, (outerR + lineW) * 2, bandHalfW * 2);

            // 斜切帶兩側黑線
            targetCtx.strokeStyle = PALETTE.BLACK;
            targetCtx.lineWidth = lineW;
            targetCtx.beginPath();
            targetCtx.moveTo(-outerR, -bandHalfW);
            targetCtx.lineTo(outerR, -bandHalfW);
            targetCtx.moveTo(-outerR, bandHalfW);
            targetCtx.lineTo(outerR, bandHalfW);
            targetCtx.stroke();

            targetCtx.restore();
        }

        /**
         * 繪製整張「歡樂掟彩虹」拼接膠墊檯面
         */
        function renderFullBoard(targetCtx, w, h, isHitMap) {
            targetCtx.clearRect(0, 0, w, h);
            targetCtx.fillStyle = isHitMap ? '#FFFFFF' : PALETTE.WHITE;
            targetCtx.fillRect(0, 0, w, h);

            const minDim = Math.min(w, h);
            const lineW = Math.max(2.6, minDim * 0.0085); // 精準黑線寬度

            // 1. 最外圍四邊半圓波浪陣列 (還原照片上下左右四邊)
            const topCols = 5;
            const stepX = w / topCols;
            const edgeR = stepX * 0.45;
            for (let i = 0; i < topCols; i++) {
                const cx = stepX * (i + 0.5);
                drawRainbowUnit(targetCtx, cx, 0, edgeR, 0, Math.PI, lineW, isHitMap, { labelAngle: Math.PI * 0.5 });
                drawRainbowUnit(targetCtx, cx, h, edgeR, Math.PI, Math.PI * 2, lineW, isHitMap, { labelAngle: -Math.PI * 0.5 });
            }

            const sideRows = 3;
            const stepY = h / sideRows;
            const sideR = stepY * 0.43;
            for (let j = 0; j < sideRows; j++) {
                const cy = stepY * (j + 0.5);
                drawRainbowUnit(targetCtx, 0, cy, sideR, -Math.PI / 2, Math.PI / 2, lineW, isHitMap, { labelAngle: 0 });
                drawRainbowUnit(targetCtx, w, cy, sideR, Math.PI / 2, Math.PI * 1.5, lineW, isHitMap, { labelAngle: Math.PI });
            }

            // 2. 內框拼接交錯 S 型波浪彩虹帶 (還原照片中層左右上下交錯半圓)
            const innerLeft = w * 0.17;
            const innerRight = w * 0.83;
            const innerTop = h * 0.17;
            const innerBottom = h * 0.83;
            const midR = minDim * 0.135;

            // 上下內排交錯半圓
            [0.30, 0.50, 0.70].forEach((ratioX, idx) => {
                const x = w * ratioX;
                drawRainbowUnit(targetCtx, x, innerTop, midR, idx % 2 === 0 ? 0 : Math.PI, idx % 2 === 0 ? Math.PI : Math.PI * 2, lineW, isHitMap);
                drawRainbowUnit(targetCtx, x, innerBottom, midR, idx % 2 === 0 ? Math.PI : 0, idx % 2 === 0 ? Math.PI * 2 : Math.PI, lineW, isHitMap);
            });

            // 左右內排交錯半圓
            [0.34, 0.66].forEach((ratioY, idx) => {
                const y = h * ratioY;
                drawRainbowUnit(targetCtx, innerLeft, y, midR * 0.95, idx % 2 === 0 ? -Math.PI / 2 : Math.PI / 2, idx % 2 === 0 ? Math.PI / 2 : Math.PI * 1.5, lineW, isHitMap);
                drawRainbowUnit(targetCtx, innerRight, y, midR * 0.95, idx % 2 === 0 ? Math.PI / 2 : -Math.PI / 2, idx % 2 === 0 ? Math.PI * 1.5 : Math.PI / 2, lineW, isHitMap);
            });

            // 3. 中央核心大獎區：五組斜切彩虹圓 (還原照片中間五環結構)
            const cx = w * 0.5;
            const cy = h * 0.5;
            const coreR = minDim * 0.145;

            // 正中央藍紫心斜切圓
            drawSlicedRainbowCircle(targetCtx, cx, cy, coreR * 1.05, -0.35, lineW, isHitMap, true);

            // 四角斜切彩虹圓
            const offsetX = w * 0.17;
            const offsetY = h * 0.165;
            drawSlicedRainbowCircle(targetCtx, cx - offsetX, cy - offsetY, coreR * 0.92, -0.35, lineW, isHitMap, false);
            drawSlicedRainbowCircle(targetCtx, cx + offsetX, cy - offsetY, coreR * 0.92, 0.35, lineW, isHitMap, false);
            drawSlicedRainbowCircle(targetCtx, cx - offsetX, cy + offsetY, coreR * 0.92, 0.35, lineW, isHitMap, false);
            drawSlicedRainbowCircle(targetCtx, cx + offsetX, cy + offsetY, coreR * 0.92, -0.35, lineW, isHitMap, false);

            // 4. 中央點綴小半圓 (黃紫小半圓，還原照片細節)
            const miniR = minDim * 0.045;
            function drawMiniHalf(mx, my, sA, eA) {
                targetCtx.beginPath();
                targetCtx.arc(mx, my, miniR, sA, eA);
                targetCtx.closePath();
                targetCtx.fillStyle = PALETTE.YELLOW;
                targetCtx.fill();
                targetCtx.lineWidth = lineW * 0.85;
                targetCtx.strokeStyle = PALETTE.BLACK;
                targetCtx.stroke();

                targetCtx.beginPath();
                targetCtx.arc(mx, my, miniR * 0.5, sA, eA);
                targetCtx.closePath();
                targetCtx.fillStyle = PALETTE.PURPLE;
                targetCtx.fill();
                targetCtx.stroke();
            }

            drawMiniHalf(cx, cy - offsetY * 1.05, 0, Math.PI);
            drawMiniHalf(cx, cy + offsetY * 1.05, Math.PI, Math.PI * 2);
            drawMiniHalf(cx - offsetX * 1.05, cy, -Math.PI / 2, Math.PI / 2);
            drawMiniHalf(cx + offsetX * 1.05, cy, Math.PI / 2, Math.PI * 1.5);

            // 拼接膠墊的拼接縫隙陰影 (僅顯示於視覺層)
            if (!isHitMap) {
                targetCtx.save();
                targetCtx.strokeStyle = 'rgba(15, 23, 42, 0.22)';
                targetCtx.lineWidth = 1.5;
                targetCtx.strokeRect(innerLeft, innerTop, innerRight - innerLeft, innerBottom - innerTop);
                targetCtx.restore();
            }
        }

        // 尺寸自適應與離屏緩存更新
        function handleResize() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;

            boardCacheCanvas.width = rect.width * dpr;
            boardCacheCanvas.height = rect.height * dpr;

            hitCanvas.width = Math.round(rect.width);
            hitCanvas.height = Math.round(rect.height);

            // 真實代幣比例
            gameState.coinRadius = Math.max(9.5, Math.min(rect.width, rect.height) * 0.032);

            // 預先渲染高清底圖到緩存畫布
            boardCacheCtx.save();
            boardCacheCtx.scale(dpr, dpr);
            renderFullBoard(boardCacheCtx, rect.width, rect.height, false);
            boardCacheCtx.restore();

            // 渲染 1:1 判定畫布
            renderFullBoard(hitCtx, hitCanvas.width, hitCanvas.height, true);
        }

        window.addEventListener('resize', handleResize);

        /**
         * 像素級「不壓黑線」精準裁判系統
         * 掃描金幣圓形覆蓋的所有像素，若觸及黑線、白底或跨色即判「擲界」。
         */
        function judgeCoinPosition(x, y, radius) {
            const w = hitCanvas.width;
            const h = hitCanvas.height;

            if (x - radius < 2 || x + radius > w - 2 || y - radius < 2 || y + radius > h - 2) {
                return { win: false, title: '飛出界外！擲界 ❌', style: 'bg-slate-900 text-red-400 border-red-500', tickets: 0 };
            }

            const startX = Math.floor(x - radius);
            const startY = Math.floor(y - radius);
            const boxSize = Math.ceil(radius * 2);
            const pixels = hitCtx.getImageData(startX, startY, boxSize, boxSize).data;

            let colorHit = null;
            const effectiveR = radius - 0.6; // 保留 0.6px 合理邊緣公差

            for (let py = 0; py < boxSize; py++) {
                for (let px = 0; px < boxSize; px++) {
                    const dx = (startX + px) - x;
                    const dy = (startY + py) - y;
                    if (dx * dx + dy * dy <= effectiveR * effectiveR) {
                        const i = (py * boxSize + px) * 4;
                        const r = pixels[i];
                        const g = pixels[i + 1];
                        const b = pixels[i + 2];

                        // 黑線判定 (TOUCHING THE BLACK LINE LOSES)
                        if (r < 70 && g < 70 && b < 70) {
                            return { win: false, title: '壓中黑線！擲界 ❌', style: 'bg-slate-950 text-red-400 border-red-500', tickets: 0 };
                        }

                        // 白色底板判定
                        if (r > 235 && g > 235 && b > 235) {
                            return { win: false, title: '落在白底！無獎 ❌', style: 'bg-slate-800 text-slate-300 border-slate-400', tickets: 0 };
                        }

                        let band = '';
                        if (r > 200 && g < 100 && b < 100) band = 'RED';
                        else if (g > 160 && r < 100) band = 'GREEN';
                        else if (r > 200 && g > 170 && b < 80) band = 'YELLOW';
                        else if (b > 200 && r < 100) band = 'BLUE';
                        else if (r > 110 && b > 180) band = 'PURPLE';

                        if (band) {
                            if (colorHit && colorHit !== band) {
                                return { win: false, title: '跨色壓界！擲界 ❌', style: 'bg-slate-950 text-red-400 border-red-500', tickets: 0 };
                            }
                            colorHit = band;
                        }
                    }
                }
            }

            switch (colorHit) {
                case 'BLUE':
                case 'PURPLE':
                    return { win: true, title: '👑 紫色大獎 CHOICE！+200 獎券', style: 'bg-purple-600 text-yellow-300 border-yellow-200', tickets: 200 };
                case 'YELLOW':
                    return { win: true, title: '🏎️ 黃色大獎 LARGE！+80 獎券', style: 'bg-yellow-400 text-slate-950 border-white', tickets: 80 };
                case 'GREEN':
                    return { win: true, title: '🧸 綠色中獎 MEDIUM！+30 獎券', style: 'bg-green-600 text-white border-green-200', tickets: 30 };
                case 'RED':
                    return { win: true, title: '🦐 紅色中獎 SMALL！+10 獎券', style: 'bg-red-600 text-white border-yellow-300', tickets: 10 };
                default:
                    return { win: false, title: '擲界無獎 ❌', style: 'bg-slate-800 text-slate-300 border-slate-500', tickets: 0 };
            }
        }

        // 顯示裁判橫幅
        let bannerTimer;
        function announceJudge(res) {
            const banner = document.getElementById('judge-banner');
            const textEl = document.getElementById('judge-text');
            textEl.textContent = res.title;
            textEl.className = `px-5 py-2 rounded-full font-black text-sm sm:text-xl shadow-2xl border-2 ${res.style}`;
            banner.style.opacity = '1';

            clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => {
                banner.style.opacity = '0';
            }, 2400);
        }

        // 中獎金色火花粒子
        function createConfetti(x, y) {
            const colors = ['#FDE047', '#EF4444', '#22C55E', '#38BDF8', '#E879F9'];
            for (let i = 0; i < 32; i++) {
                const angle = (Math.PI * 2 * i) / 32 + Math.random() * 0.2;
                const spd = 2 + Math.random() * 4.5;
                gameState.particles.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 1,
                    color: colors[i % colors.length],
                    r: 3 + Math.random() * 3
                });
            }
        }

        // 投出金幣
        function tossCoin(targetX, targetY) {
            if (gameState.flyingCoin) return;
            if (gameState.coins <= 0) {
                announceJudge({ title: '🪙 代幣用完！請按右下角免費入幣', style: 'bg-amber-400 text-slate-950 border-white' });
                return;
            }

            document.getElementById('hint-pill').style.display = 'none';
            gameState.coins--;
            refreshHUD();
            triggerSound('toss');

            const w = hitCanvas.width;
            const h = hitCanvas.height;

            // 自然拋物線手勢微幅隨機偏差 (±3.5px)
            const tx = Math.max(16, Math.min(w - 16, targetX + (Math.random() - 0.5) * 7));
            const ty = Math.max(16, Math.min(h - 16, targetY + (Math.random() - 0.5) * 7));

            gameState.flyingCoin = {
                startX: w * 0.5,
                startY: h + 28,
                tx, ty,
                x: w * 0.5,
                y: h + 28,
                frame: 0,
                maxFrames: 26,
                vx: (tx - w * 0.5) * 0.01,
                vy: -1.3 - Math.random() * 0.7,
                stage: 'fly'
            };
        }

        // 繪製仿真遊戲代幣 (參考圖2中刻有字樣的黃銅代幣)
        function drawArcadeToken(targetCtx, x, y, r, scale = 1, isWinner = false) {
            targetCtx.save();
            targetCtx.translate(x, y);
            targetCtx.scale(scale, scale);

            // 投影
            targetCtx.beginPath();
            targetCtx.arc(1.5, 2.5, r, 0, Math.PI * 2);
            targetCtx.fillStyle = 'rgba(0, 0, 0, 0.38)';
            targetCtx.fill();

            // 黃銅金屬漸層
            const grad = targetCtx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
            grad.addColorStop(0, '#FEF9C3');
            grad.addColorStop(0.55, '#EAB308');
            grad.addColorStop(1, '#854D0E');

            targetCtx.beginPath();
            targetCtx.arc(0, 0, r, 0, Math.PI * 2);
            targetCtx.fillStyle = grad;
            targetCtx.fill();

            targetCtx.lineWidth = 1.4;
            targetCtx.strokeStyle = isWinner ? '#FFFFFF' : '#713F12';
            targetCtx.stroke();

            // 內凹環紋
            targetCtx.beginPath();
            targetCtx.arc(0, 0, r * 0.72, 0, Math.PI * 2);
            targetCtx.strokeStyle = 'rgba(113, 63, 18, 0.7)';
            targetCtx.lineWidth = 1;
            targetCtx.stroke();

            // 中央代幣方框字樣模擬
            targetCtx.fillStyle = 'rgba(113, 63, 18, 0.85)';
            targetCtx.fillRect(-r * 0.42, -r * 0.18, r * 0.84, r * 0.36);
            targetCtx.fillStyle = '#FEF08A';
            targetCtx.font = `bold ${Math.max(5, Math.round(r * 0.32))}px sans-serif`;
            targetCtx.textAlign = 'center';
            targetCtx.textBaseline = 'middle';
            targetCtx.fillText('TOKEN', 0, 0.5);

            targetCtx.restore();
        }

        // 繪製右上角「壓界特寫放大鏡」(讓玩家看清到底有沒有壓到黑線)
        function drawZoomInspector(targetCtx, w, h) {
            if (!gameState.showZoomLens || !gameState.lastLandingSpot || gameState.zoomTimer <= 0) return;

            const spot = gameState.lastLandingSpot;
            const lensR = Math.min(w, h) * 0.14;
            const lensX = w - lensR - 14;
            const lensY = lensR + 14;
            const zoomFactor = 2.6;

            targetCtx.save();

            // 放大鏡外框陰影
            targetCtx.beginPath();
            targetCtx.arc(lensX, lensY, lensR, 0, Math.PI * 2);
            targetCtx.fillStyle = '#FFFFFF';
            targetCtx.shadowColor = 'rgba(0,0,0,0.55)';
            targetCtx.shadowBlur = 12;
            targetCtx.fill();
            targetCtx.shadowBlur = 0;

            // 裁切圓形視窗
            targetCtx.clip();

            // 放大繪製底圖
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            targetCtx.save();
            targetCtx.translate(lensX, lensY);
            targetCtx.scale(zoomFactor, zoomFactor);
            targetCtx.translate(-spot.x, -spot.y);
            targetCtx.drawImage(boardCacheCanvas, 0, 0, w * dpr, h * dpr, 0, 0, w, h);

            // 放大繪製落點附近金幣
            gameState.landedCoins.forEach(c => {
                if (Math.hypot(c.x - spot.x, c.y - spot.y) < lensR) {
                    drawArcadeToken(targetCtx, c.x, c.y, gameState.coinRadius, 1, c.isWinner);
                }
            });
            targetCtx.restore();

            // 放大鏡外框邊線 (中獎綠框 / 擲界紅框)
            targetCtx.beginPath();
            targetCtx.arc(lensX, lensY, lensR, 0, Math.PI * 2);
            targetCtx.lineWidth = 4;
            targetCtx.strokeStyle = spot.win ? '#22C55E' : '#EF4444';
            targetCtx.stroke();

            // 底部標籤
            targetCtx.fillStyle = spot.win ? 'rgba(22, 163, 74, 0.9)' : 'rgba(220, 38, 38, 0.9)';
            targetCtx.fillRect(lensX - lensR, lensY + lensR - 20, lensR * 2, 20);
            targetCtx.fillStyle = '#FFFFFF';
            targetCtx.font = 'bold 10px sans-serif';
            targetCtx.textAlign = 'center';
            targetCtx.fillText(spot.win ? '放大檢視: 過關' : '放大檢視: 壓界', lensX, lensY + lensR - 7);

            targetCtx.restore();
        }

        function updatePhysics() {
            const fc = gameState.flyingCoin;
            if (fc) {
                if (fc.stage === 'fly') {
                    fc.frame++;
                    const t = fc.frame / fc.maxFrames;
                    const ease = 1 - Math.pow(1 - t, 2.1);
                    fc.x = fc.startX + (fc.tx - fc.startX) * ease;
                    fc.y = fc.startY + (fc.ty - fc.startY) * ease;

                    if (fc.frame >= fc.maxFrames) {
                        fc.stage = 'slide';
                        triggerSound('clink');
                    }
                } else if (fc.stage === 'slide') {
                    fc.x += fc.vx;
                    fc.y += fc.vy;
                    fc.vx *= 0.80;
                    fc.vy *= 0.80;

                    if (Math.hypot(fc.vx, fc.vy) < 0.07) {
                        const result = judgeCoinPosition(fc.x, fc.y, gameState.coinRadius);

                        gameState.landedCoins.push({
                            x: fc.x,
                            y: fc.y,
                            isWinner: result.win
                        });
                        if (gameState.landedCoins.length > 50) {
                            gameState.landedCoins.shift();
                        }

                        gameState.lastLandingSpot = { x: fc.x, y: fc.y, win: result.win };
                        gameState.zoomTimer = 160; // 顯示特寫放大鏡約 2.6 秒

                        if (result.win) {
                            gameState.tickets += result.tickets;
                            refreshHUD();
                            createConfetti(fc.x, fc.y);
                            triggerSound(result.tickets >= 80 ? 'jackpot' : 'win');
                        } else {
                            triggerSound('lose');
                        }

                        announceJudge(result);
                        gameState.flyingCoin = null;
                    }
                }
            }

            if (gameState.zoomTimer > 0) {
                gameState.zoomTimer--;
            }

            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const p = gameState.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.024;
                if (p.life <= 0) gameState.particles.splice(i, 1);
            }
        }

        function renderScene() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = hitCanvas.width;
            const h = hitCanvas.height;

            ctx.save();
            ctx.scale(dpr, dpr);

            // 1. 貼上預渲染的高清彩虹地墊
            ctx.drawImage(boardCacheCanvas, 0, 0, w * dpr, h * dpr, 0, 0, w, h);

            // 2. 繪製已落地的金幣
            gameState.landedCoins.forEach(c => {
                drawArcadeToken(ctx, c.x, c.y, gameState.coinRadius, 1, c.isWinner);
            });

            // 3. 繪製瞄準預覽框 (顯示實際代幣大小方便玩家預判是否會壓黑線)
            if (gameState.isAiming && !gameState.flyingCoin) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(gameState.aimX, gameState.aimY, gameState.coinRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(254, 240, 138, 0.35)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#FFFFFF';
                ctx.setLineDash([3, 3]);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(gameState.aimX, gameState.aimY, gameState.coinRadius + 4, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.restore();
            }

            // 4. 繪製空中拋物線金幣
            const fc = gameState.flyingCoin;
            if (fc) {
                let scale = 1;
                if (fc.stage === 'fly') {
                    const t = fc.frame / fc.maxFrames;
                    scale = 1 + Math.sin(t * Math.PI) * 0.85;
                }
                drawArcadeToken(ctx, fc.x, fc.y, gameState.coinRadius, scale, false);
            }

            // 5. 繪製慶祝彩帶粒子
            gameState.particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 6. 繪製壓界特寫放大鏡
            drawZoomInspector(ctx, w, h);

            ctx.restore();
        }

        function mainLoop() {
            updatePhysics();
            renderScene();
            requestAnimationFrame(mainLoop);
        }

        function refreshHUD() {
            document.getElementById('hud-coins').textContent = gameState.coins;
            document.getElementById('hud-tickets').textContent = gameState.tickets;
            const addBtn = document.getElementById('add-coin-btn');
            if (gameState.coins === 0) {
                addBtn.classList.add('animate-bounce');
            } else {
                addBtn.classList.remove('animate-bounce');
            }
        }

        function getCanvasCoords(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            setupAudio();
            const pos = getCanvasCoords(e);
            gameState.isAiming = true;
            gameState.aimX = pos.x;
            gameState.aimY = pos.y;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!gameState.isAiming && e.pointerType === 'touch') return;
            const pos = getCanvasCoords(e);
            gameState.aimX = pos.x;
            gameState.aimY = pos.y;
            if (e.pointerType === 'mouse') gameState.isAiming = true;
        });

        canvas.addEventListener('pointerup', (e) => {
            if (!gameState.isAiming) return;
            const pos = getCanvasCoords(e);
            tossCoin(pos.x, pos.y);
            if (e.pointerType === 'touch') gameState.isAiming = false;
        });

        canvas.addEventListener('pointerleave', () => {
            gameState.isAiming = false;
        });

        // 按鈕互動
        document.getElementById('add-coin-btn').addEventListener('click', () => {
            setupAudio();
            gameState.coins += 10;
            refreshHUD();
            triggerSound('win');
            announceJudge({ title: '🪙 已投入 10 枚代幣！祝你好運', style: 'bg-yellow-400 text-slate-950 border-white' });
        });

        document.getElementById('sweep-btn').addEventListener('click', () => {
            gameState.landedCoins = [];
            gameState.lastLandingSpot = null;
            announceJudge({ title: '🧹 職員已清空檯面代幣', style: 'bg-slate-800 text-white border-slate-400' });
        });

        document.getElementById('mute-btn').addEventListener('click', (e) => {
            gameState.soundOn = !gameState.soundOn;
            e.target.textContent = gameState.soundOn ? '🔊 音效開' : '🔇 音效關';
        });

        document.getElementById('zoom-toggle-btn').addEventListener('click', (e) => {
            gameState.showZoomLens = !gameState.showZoomLens;
            e.target.textContent = gameState.showZoomLens ? '🔍 壓界特寫: 開' : '🔍 壓界特寫: 關';
        });

        // 玩法說明彈窗
        const rulesModal = document.getElementById('rules-modal');
        document.getElementById('open-rules-btn').addEventListener('click', () => {
            rulesModal.classList.remove('hidden');
            rulesModal.classList.add('flex');
        });
        document.getElementById('close-rules-btn').addEventListener('click', () => {
            rulesModal.classList.add('hidden');
            rulesModal.classList.remove('flex');
        });

        window.onload = function () {
            handleResize();
            refreshHUD();
            mainLoop();
        };
    </script>
</body>
